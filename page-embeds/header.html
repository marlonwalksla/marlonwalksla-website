<!-- ==============================================================================
     MARLONWALKSLA - GLOBAL HEADER (inside the HEADER component in Webflow)
     Reference copy: Webflow is the source (component fc979ec1-e8bd-a2a9-3ff2-770d0f3b2408,
     HtmlEmbed 1b2f48e8-f203-9de1-4fa2-411d036c10f7). Keep in sync.
     Nov 25, 2026 (v2): Tours (Free, Private, Group) and Travel Guides (LA Map, Passports & Stamps)
     dropdowns, then History, About, EN | ES and an outline "Book a Free Tour" pill that goes to
     the Home calendar (/#book or /es#book). Phone and tablet (980px and under): logo, EN | ES,
     a small Book pill and the menu button; the menu shows the same two groups.
     The data-k keys are new on purpose: nav-header.js (on main) adds Passports and Stamps
     after a[data-k="maps"], and this header no longer has that key, so nothing is added twice.
     Spanish is detected from the path list OR from <html lang>; labelling runs again on
     DOMContentLoaded and load. Links marked data-mw-pair keep their own EN | ES hrefs.
     The Home calendar loads after the page, so /#book waits for it and then scrolls.
     ============================================================================== -->
<header class="mwhd" role="banner">
  <div class="mwhd-wrap">
    <a href="/" class="mwhd-logo" id="mwhd-home" aria-label="MarlonWalksLA home">
      <img src="https://cdn.prod.website-files.com/6a050f29c558b4d909196aad/6ae4300b0f4f05b22191d298_Circle%20Full.avif" alt="" width="38" height="38">
      <span>MarlonWalks<b>LA</b></span>
    </a>
    <div class="mwhd-right">
      <nav class="mwhd-nav" id="mwhd-menu" aria-label="Main">
        <div class="mwhd-dd">
          <button type="button" class="mwhd-link mwhd-ddbtn" aria-expanded="false" aria-haspopup="true"><span data-t="tours">Tours</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
          <div class="mwhd-ddlist" role="group" aria-label="Tours">
            <a href="/free-walking-tour-los-angeles" class="mwhd-link" data-k="free">Free Tour</a>
            <a href="/private-tour-los-angeles" class="mwhd-link" data-k="private">Private Tour</a>
            <a href="/group-tours-los-angeles" class="mwhd-link" data-k="team">Group Tour</a>
          </div>
        </div>
        <div class="mwhd-dd">
          <button type="button" class="mwhd-link mwhd-ddbtn" aria-expanded="false" aria-haspopup="true"><span data-t="guides">Travel Guides</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
          <div class="mwhd-ddlist" role="group" aria-label="Travel Guides">
            <a href="/maps" class="mwhd-link" data-k="lamap">LA Map</a>
            <a href="/passports" class="mwhd-link" data-k="pp">Passports &amp; Stamps</a>
          </div>
        </div>
        <a href="/history" class="mwhd-link" data-k="history">History</a>
        <a href="/about" class="mwhd-link" data-k="about">About</a>
      </nav>
      <div class="mwhd-lang" role="group" aria-label="Language / Idioma">
        <a href="/" id="mwhd-en" lang="en" hreflang="en">EN</a>
        <a href="/es" id="mwhd-es" lang="es" hreflang="es">ES</a>
      </div>
      <a href="/#book" class="mwhd-book" id="mwhd-book"><span class="mwhd-bk-l">Book a Free Tour</span><span class="mwhd-bk-s" aria-hidden="true">Book</span></a>
      <button type="button" class="mwhd-burger" id="mwhd-burger" aria-expanded="false" aria-controls="mwhd-menu" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path class="mwhd-b1" d="M4 7h16M4 12h16M4 17h16"/><path class="mwhd-b2" d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
</header>
<style>
  .mwhd { background: #27302E; color: #FFF6E6; position: relative; z-index: 999999; font-family: "Fredoka", "Nunito", system-ui, sans-serif; }
  .mwhd *, .mwhd *::before { box-sizing: border-box; }
  .mwhd-wrap { max-width: 1200px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .mwhd-logo { display: flex; align-items: center; gap: 10px; text-decoration: none !important; color: #FFF6E6 !important; flex-shrink: 0; }
  .mwhd-logo img { width: 38px; height: 38px; border-radius: 50%; display: block; }
  .mwhd-logo span { font-family: "Lilita One", sans-serif; font-size: 1.35rem; letter-spacing: 0.01em; line-height: 1; white-space: nowrap; }
  .mwhd-logo b { font-weight: 400; color: #FFD43B; }
  .mwhd-right { display: flex; align-items: center; gap: 14px; }
  .mwhd-nav { display: flex; align-items: center; gap: 2px; }
  .mwhd-link { color: #FFF6E6 !important; text-decoration: none !important; font-weight: 500; font-size: 1.02rem; padding: 9px 12px; border-radius: 999px; white-space: nowrap; }
  .mwhd-link:hover { color: #FFD43B !important; }
  .mwhd-link[aria-current="page"] { color: #27302E !important; background: #FFD43B; }
  .mwhd-dd { position: relative; }
  .mwhd-ddbtn { display: inline-flex; align-items: center; gap: 6px; background: transparent; border: 0; font-family: inherit; cursor: pointer; }
  .mwhd-ddbtn svg { transition: transform .15s ease-out; }
  .mwhd-dd.is-open .mwhd-ddbtn svg { transform: rotate(180deg); }
  .mwhd-ddbtn.is-current { color: #FFD43B !important; }
  .mwhd-ddlist { display: none; position: absolute; top: 100%; left: 0; min-width: 210px; flex-direction: column; gap: 2px; background: #27302E; border: 1.5px solid rgba(255, 246, 230, 0.3); border-radius: 16px; padding: 6px; box-shadow: 0 14px 24px rgba(0, 0, 0, 0.35); }
  .mwhd-dd.is-open .mwhd-ddlist, .mwhd-dd:hover .mwhd-ddlist, .mwhd-dd:focus-within .mwhd-ddlist { display: flex; }
  .mwhd-ddlist .mwhd-link { border-radius: 10px; }
  .mwhd-lang { display: inline-flex; flex-shrink: 0; border: 1.5px solid rgba(255, 246, 230, 0.55); border-radius: 999px; padding: 3px; }
  .mwhd-lang a { min-width: 44px; text-align: center; padding: 7px 10px; border-radius: 999px; font-weight: 600; font-size: 0.92rem; color: #FFF6E6 !important; text-decoration: none !important; line-height: 1.2; }
  .mwhd-lang a[aria-current="true"] { background: #FFD43B; color: #27302E !important; }
  .mwhd-book { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; min-height: 40px; padding: 8px 16px; border: 2px solid #FFD43B; border-radius: 999px; color: #FFD43B !important; text-decoration: none !important; font-weight: 600; font-size: 0.95rem; line-height: 1.1; white-space: nowrap; transition: background-color .15s ease-out, color .15s ease-out; }
  .mwhd-book:hover { background: #FFD43B; color: #27302E !important; }
  .mwhd-bk-s { display: none; }
  .mwhd-burger { display: none; align-items: center; justify-content: center; flex-shrink: 0; width: 44px; height: 44px; padding: 0; background: transparent; color: #FFF6E6; border: 1.5px solid rgba(255, 246, 230, 0.55); border-radius: 999px; cursor: pointer; }
  .mwhd-burger .mwhd-b2 { display: none; }
  .mwhd-burger[aria-expanded="true"] .mwhd-b1 { display: none; }
  .mwhd-burger[aria-expanded="true"] .mwhd-b2 { display: block; }
  .mwhd a:focus-visible, .mwhd button:focus-visible { outline: 2px solid #FFD43B; outline-offset: 3px; }
  @media (max-width: 1100px) {
    .mwhd-wrap { padding: 10px 18px; gap: 12px; }
    .mwhd-right { gap: 10px; }
    .mwhd-link { padding: 9px 9px; font-size: 0.98rem; }
  }
  @media (max-width: 980px) {
    .mwhd-wrap { padding: 8px 14px; gap: 10px; }
    .mwhd-right { gap: 8px; }
    .mwhd-burger { display: inline-flex; }
    .mwhd-nav { display: none; position: absolute; left: 0; right: 0; top: 100%; flex-direction: column; align-items: stretch; gap: 0; background: #27302E; padding: 6px 14px 16px; border-top: 1px solid rgba(255, 246, 230, 0.18); box-shadow: 0 14px 24px rgba(0, 0, 0, 0.35); max-height: calc(100vh - 64px); overflow-y: auto; }
    .mwhd-nav.is-open { display: flex; }
    .mwhd-ddbtn { pointer-events: none; font-size: 0.9rem; padding: 14px 12px 4px; min-height: 0; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.06em; }
    .mwhd-ddbtn svg { display: none; }
    .mwhd-ddbtn.is-current { color: #FFF6E6 !important; }
    .mwhd-ddlist, .mwhd-dd:hover .mwhd-ddlist { display: flex; position: static; background: none; border: 0; box-shadow: none; padding: 0 0 6px 12px; min-width: 0; }
    .mwhd-nav > .mwhd-link { margin-top: 6px; border-top: 1px solid rgba(255, 246, 230, 0.12); border-radius: 0 0 12px 12px; }
    .mwhd-nav > .mwhd-link + .mwhd-link { margin-top: 0; border-top: 0; border-radius: 12px; }
    .mwhd-link { font-size: 1.2rem; padding: 12px 12px; border-radius: 12px; min-height: 48px; display: flex; align-items: center; }
  }
  @media (max-width: 600px) {
    .mwhd-bk-l { display: none; }
    .mwhd-bk-s { display: inline; }
    .mwhd-book { min-height: 40px; padding: 7px 13px; font-size: 0.9rem; }
  }
  @media (max-width: 480px) {
    .mwhd-wrap { padding: 8px 10px; gap: 8px; }
    .mwhd-right { gap: 6px; }
    .mwhd-logo img { width: 32px; height: 32px; }
    .mwhd-logo span { font-size: 1.05rem; }
    .mwhd-logo { gap: 7px; }
    .mwhd-lang a { min-width: 34px; padding: 7px 6px; font-size: 0.86rem; }
    .mwhd-book { padding: 7px 11px; }
    .mwhd-burger { width: 42px; height: 42px; }
  }
  @media (max-width: 389px) {
    .mwhd-logo img { width: 28px; height: 28px; }
    .mwhd-logo { gap: 6px; }
    .mwhd-logo span { font-size: 0.92rem; }
    .mwhd-lang a { min-width: 30px; padding: 7px 5px; font-size: 0.82rem; }
    .mwhd-book { padding: 7px 9px; font-size: 0.85rem; }
  }
</style>
<script>
  (function () {
    var path = (location.pathname.replace(/\/+$/, '') || '/');
    var pairs = [
      ['/', '/es'],
      ['/free-walking-tour-los-angeles', '/free-tour-los-angeles-espanol'],
      ['/ernesto', '/ernesto-es'],
      ['/group-tours-los-angeles', '/tours-para-grupos-los-angeles'],
      ['/passports', '/pasaportes'],
      ['/stamps', '/sellos'],
      ['/private-tour-los-angeles', '/tours-privados-los-angeles'],
      ['/maps', '/mapa-los-angeles'],
      ['/history', '/historia-de-los-angeles']
    ];
    var esPages = ['/es', '/free-tour-los-angeles-espanol', '/ernesto-es', '/tours-para-grupos-los-angeles', '/tours-privados-los-angeles', '/mapa-los-angeles', '/historia-de-los-angeles', '/pasaportes', '/sellos'];
    // Blog stories: /blog/<slug> (English) and /historias/<slug> (Spanish)
    var STORIES = { 'walt-disney-concert-hall': 'walt-disney-concert-hall', 'the-broad': 'the-broad', 'angels-flight': 'angels-flight', 'city-hall': 'city-hall', 'olvera-street': 'calle-olvera' };
    var ES = {
      free: ['/free-tour-los-angeles-espanol', 'Free Tour'],
      'private': ['/tours-privados-los-angeles', 'Tour Privado'],
      team: ['/tours-para-grupos-los-angeles', 'Tour en Grupo'],
      lamap: ['/mapa-los-angeles', 'Mapa de LA'],
      pp: ['/pasaportes', 'Pasaportes y Sellos'],
      history: ['/historia-de-los-angeles', 'Historia'],
      about: ['/about', 'Sobre mí']
    };
    var ES_T = { tours: 'Tours', guides: 'Guías de viaje' };
    // Pages that count as "here" for a menu item (Passports & Stamps covers both pages)
    var ALSO = { pp: ['/passports', '/pasaportes', '/stamps', '/sellos'], lamap: ['/maps', '/mapa-los-angeles'] };

    function isSpanish() {
      if (esPages.indexOf(path) > -1) return true;
      if (path.indexOf('/historias/') === 0) return true;
      return (document.documentElement.lang || '').toLowerCase().indexOf('es') === 0;
    }

    function localize() {
      var isEs = isSpanish();
      var enHref = '/', esHref = '/es', storyEn = null, storyEs = null, i, j, k;
      var bm = path.match(/^\/blog\/([^\/]+)$/), hm = path.match(/^\/historias\/([^\/]+)$/);
      if (bm && STORIES[bm[1]]) { storyEn = path; storyEs = '/historias/' + STORIES[bm[1]]; }
      if (hm) { for (k in STORIES) { if (STORIES[k] === hm[1]) { storyEn = '/blog/' + k; storyEs = path; } } }
      for (i = 0; i < pairs.length; i++) {
        if (path === pairs[i][0] || path === pairs[i][1]) { enHref = pairs[i][0]; esHref = pairs[i][1]; }
      }
      if (/^\/(passports|pasaportes)$/.test(path)) {
        var q = location.search.replace(/[?&]lang=[a-z]+/i, '').replace(/^&/, '?');
        enHref += q; esHref += q;
      }
      if (storyEn) { enHref = storyEn; esHref = storyEs; }
      var en = document.getElementById('mwhd-en'), es = document.getElementById('mwhd-es');
      var home = document.getElementById('mwhd-home');
      var owned = (en && en.hasAttribute('data-mw-pair')) || (es && es.hasAttribute('data-mw-pair'));
      if (en) { if (!owned) en.href = enHref; en.setAttribute('aria-current', isEs ? 'false' : 'true'); }
      if (es) { if (!owned) es.href = esHref; es.setAttribute('aria-current', isEs ? 'true' : 'false'); }
      var links = document.querySelectorAll('.mwhd-nav .mwhd-link[data-k]');
      for (j = 0; j < links.length; j++) {
        var a = links[j], dk = a.getAttribute('data-k');
        if (isEs && ES[dk]) { a.href = ES[dk][0]; a.textContent = ES[dk][1]; }
        var here = (a.getAttribute('href') || '').replace(/\/+$/, '') === path || (ALSO[dk] && ALSO[dk].indexOf(path) > -1);
        if (here) a.setAttribute('aria-current', 'page');
      }
      if (isEs) {
        var ts = document.querySelectorAll('.mwhd [data-t]');
        for (j = 0; j < ts.length; j++) { var t = ES_T[ts[j].getAttribute('data-t')]; if (t) ts[j].textContent = t; }
        var gl = document.querySelectorAll('.mwhd-ddlist');
        if (gl[1]) gl[1].setAttribute('aria-label', 'Guías de viaje');
        if (home) home.href = '/es';
        var b0 = document.getElementById('mwhd-burger'); if (b0) b0.setAttribute('aria-label', 'Menú');
      }
      var book = document.getElementById('mwhd-book');
      if (book) {
        var onHome = path === (isEs ? '/es' : '/');
        book.href = onHome ? '#book' : (isEs ? '/es#book' : '/#book');
        book.setAttribute('aria-label', isEs ? 'Reserva un Free Tour' : 'Book a Free Tour');
        book.querySelector('.mwhd-bk-l').textContent = isEs ? 'Reserva un Free Tour' : 'Book a Free Tour';
        book.querySelector('.mwhd-bk-s').textContent = isEs ? 'Reservar' : 'Book';
      }
      var dds = document.querySelectorAll('.mwhd-dd');
      for (j = 0; j < dds.length; j++) {
        var b1 = dds[j].querySelector('.mwhd-ddbtn');
        if (b1 && dds[j].querySelector('[aria-current="page"]')) b1.classList.add('is-current');
      }
    }

    localize();
    document.addEventListener('DOMContentLoaded', localize);
    window.addEventListener('load', localize);

    // Dropdowns (desktop): click to open, click outside or Escape to close
    var dds = document.querySelectorAll('.mwhd-dd');
    function closeAll(except) {
      for (var i = 0; i < dds.length; i++) if (dds[i] !== except) { dds[i].classList.remove('is-open'); var b = dds[i].querySelector('.mwhd-ddbtn'); if (b) b.setAttribute('aria-expanded', 'false'); }
    }
    [].forEach.call(dds, function (dd) {
      var b = dd.querySelector('.mwhd-ddbtn');
      if (!b) return;
      b.addEventListener('click', function (e) { e.stopPropagation(); var o = !dd.classList.contains('is-open'); closeAll(dd); dd.classList.toggle('is-open', o); b.setAttribute('aria-expanded', o ? 'true' : 'false'); });
    });
    document.addEventListener('click', function (e) { if (!e.target.closest || !e.target.closest('.mwhd-dd')) closeAll(null); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAll(null); });

    // Phone menu
    var btn = document.getElementById('mwhd-burger'), menu = document.getElementById('mwhd-menu');
    if (btn && menu) {
      function setOpen(o) { menu.classList.toggle('is-open', o); btn.setAttribute('aria-expanded', o ? 'true' : 'false'); }
      btn.addEventListener('click', function (e) { e.stopPropagation(); setOpen(!menu.classList.contains('is-open')); });
      menu.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('a')) setOpen(false); });
      document.addEventListener('click', function (e) { if (!menu.contains(e.target) && !btn.contains(e.target)) setOpen(false); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && menu.classList.contains('is-open')) { setOpen(false); btn.focus(); } });
      window.addEventListener('resize', function () { if (window.innerWidth > 980) setOpen(false); });
    }

    // Book button: log the tap in GA
    var bk = document.getElementById('mwhd-book');
    if (bk) bk.addEventListener('click', function () { try { if (window.gtag) gtag('event', 'header_book_click', { page_path: path }); } catch (e) {} });

    // The Home calendar loads after the page. When someone arrives at /#book, wait for it, then scroll to it.
    // Other scripts and late images can move the page, so keep it on the calendar for about 3 seconds
    // after it appears, unless the visitor starts scrolling.
    if (location.hash === '#book') {
      var tries = 0, held = 0, quit = false;
      var stop = function () { quit = true; };
      ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(function (ev) { window.addEventListener(ev, stop, { once: true, passive: true }); });
      var iv = setInterval(function () {
        var t = document.getElementById('book');
        if (quit || (!t && ++tries > 50)) { clearInterval(iv); return; }
        if (!t) return;
        if (Math.abs(t.getBoundingClientRect().top) > 4) t.scrollIntoView({ block: 'start' });
        if (++held > 15) clearInterval(iv);
      }, 200);
    }
  })();
</script>
