<!-- ==============================================================================
     MARLONWALKSLA - PASSPORT MAP (v2)   Oct 26, 2026
     A fresh map built around passports. Replaces Explore/Trip, pins/visited, the quiz.
     Loaded into <div id="fp-host"> by the page footer code (test branch on the test site).
     Data: spots.geojson + passport-collections.json from the repo (@main).
     Stamps share the passport page's storage: marlon_visited_spots (stamps with a map pin)
     and marlon_stamps (stamps without a pin), so stamping in one shows in the other.
     Links: ?passport=la-tourist | downtown-classic | all   &spot=<slug>   &lang=es
     Classes all start with pmx- (Webflow has its own short class names, see the .tp bug).
     ============================================================================== -->
<style>

#pmx .pmx-prog{border:2.5px solid var(--ink);border-radius:16px;background:#fff;padding:12px 14px;margin:6px 0 12px}

#pmx .pmx-open{display:inline-block;margin-top:6px;font-weight:700;color:var(--ink);text-decoration:underline}
#pmx .pmx-done{background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;margin:-4px 0 12px;font-weight:700}
#pmx .pmx-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}

#pmx .pmx-num{flex:none;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ink);color:var(--ink);background:#fff;font-weight:800;font-size:.85rem;display:flex;align-items:center;justify-content:center}

#pmx .pmx-stamp b{display:block;font-size:.9rem}
#pmx .pmx-stamp small{display:block;font-size:.8rem;color:#64748b}
#pmx .pmx-acts{display:flex;flex-wrap:wrap;gap:8px}
#pmx .pmx-b{display:inline-flex;align-items:center;justify-content:center;padding:9px 14px;border-radius:999px;border:2px solid #27302E;background:#fff;color:#27302E !important;font-weight:700;font-size:.88rem;text-decoration:none !important;cursor:pointer}
#pmx .pmx-b.main{background:#FFD43B;box-shadow:3px 3px 0 #27302E;font-family:"Lilita One",sans-serif;font-weight:400;font-size:1rem;width:100%;margin-bottom:8px}

#pmx .pmx-load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#475569}
@media (max-width:899px){
  #pmx .pmx-wrap{grid-template-columns:1fr;grid-template-rows:auto auto auto auto;grid-template-areas:"top" "map" "card" "body";height:auto;min-height:0}

  #pmx .pmx-body{overflow:visible;padding:12px 14px 28px}
  #pmx .pmx-mapbox{height:60vh;height:60svh;min-height:340px;border-top:2.5px solid #27302E;border-bottom:2.5px solid #27302E}

  #pmx .pmx-tab{padding:6px 11px;font-size:.84rem}
  #pmx h1{font-size:1.4rem}
}
</style>

        map.getSource('pmx-all').getClusterExpansionZoom(f.properties.cluster_id, function (err, z) { if (!err) map.easeTo({ center: f.geometry.coordinates, zoom: z + 0.5 }); });
      });
      map.on('click', 'pmx-pts', function (e) { var s = byId[e.features[0].properties.id]; if (s) openCard(placeFromSpot(s)); });
      ['pmx-clusters', 'pmx-pts'].forEach(function (l) {
        map.on('mouseenter', l, function () { map.getCanvas().style.cursor = 'pointer'; });
        map.on('mouseleave', l, function () { map.getCanvas().style.cursor = ''; });
      });
      render();
      var focus = Q.get('spot');
      if (focus) setTimeout(function () { openByKey(focus); }, 600);
    });
  }

  function fit(coords) {
    if (!coords.length) return;
    var b = new mapboxgl.LngLatBounds();
    coords.forEach(function (c) { b.extend(c); });
    var phone = window.innerWidth < 900;
    var left = $('pmx-card').hidden ? 60 : 380;
    map.fitBounds(b, { padding: phone ? 40 : { top: 60, bottom: 60, left: left, right: 60 }, maxZoom: 15, duration: 700 });
  }

  function clearMarkers() { markers.forEach(function (m) { m.remove(); }); markers = []; }

  /* ---------- render ---------- */
  function render() {
    renderTabs();
    var isAll = mode === 'all';
    $('pmx-pp').hidden = isAll; $('pmx-all').hidden = !isAll;
    ['pmx-clusters', 'pmx-count', 'pmx-pts'].forEach(function (l) { if (map.getLayer(l)) map.setLayoutProperty(l, 'visibility', isAll ? 'visible' : 'none'); });
    if (isAll) { clearMarkers(); renderCats(); renderAll(); } else renderPassport();
    try { var u = new URL(location.href); u.searchParams.set('passport', mode); history.replaceState(null, '', u.toString()); } catch (e) {}
  }

  function renderTabs() {
    $('pmx-tabs').innerHTML = pps.map(function (p) {
      var ok = live(p), g = prog(p);
      return '<button type="button" class="pmx-tab" data-mode="' + esc(p.id) + '" aria-pressed="' + (mode === p.id) + '"' + (ok ? '' : ' disabled') + ' style="--ink:' + esc(p.ink || '#27302E') + '"><span class="pmx-dot"></span>' + esc(L(p.name)) + ' <em>' + (ok ? g.d + '/' + g.t : T.soon) + '</em></button>';
    }).join('') + '<button type="button" class="pmx-tab" data-mode="all" aria-pressed="' + (mode === 'all') + '">🗺️ ' + esc(T.all) + ' <em>' + spots.length + '</em></button>';
  }

  function renderPassport() {
    var p = pp(mode); if (!p) return;
    var ink = p.ink || '#27302E', list = stops(p), g = prog(p), page = PPAGE[p.id];
    root.style.setProperty('--ink', ink);
    var h = '<div class="pmx-prog"><div class="pmx-prog-top"><b>' + esc(L(p.name)) + '</b><span>' + g.d + '/' + g.t + '</span></div>' +
      '<div class="pmx-bar"><i style="width:' + (g.t ? Math.round(g.d / g.t * 100) : 0) + '%"></i></div><small>' + esc(T.of(g.d, g.t)) + '</small>' +
      (page ? '<a class="pmx-open" href="' + page + (ES ? '?lang=es' : '') + '">' + esc(T.open) + ' →</a>' : '') + '</div>';
    if (g.t && g.d === g.t) h += '<div class="pmx-done">🎉 ' + esc(T.done) + '</div>';
    h += '<ol class="pmx-list">' + list.map(function (o) {
      var on = stamped(o.st), c = cat(o.cat);
      return '<li><button type="button" data-key="' + esc(o.key) + '"><span class="pmx-num' + (on ? ' on' : '') + '">' + (on ? '✓' : o.n) + '</span><span class="pmx-li-t"><b>' + esc(o.name) + '</b><small>' + c.e + ' ' + esc(L(c)) + (o.city ? ' · ' + esc(o.city) : '') + '</small></span></button></li>';
    }).join('') + '</ol>';
    $('pmx-pp').innerHTML = h;
    clearMarkers();
    list.forEach(function (o) {
      var on = stamped(o.st), wrap = document.createElement('div'), pin = document.createElement('div');
      pin.className = 'pmx-pin' + (on ? ' on' : '') + (card && card.key === o.key ? ' sel' : '');
      pin.style.setProperty('--ink', ink); pin.textContent = on ? '✓' : o.n; pin.title = o.name;
      wrap.appendChild(pin);
      wrap.addEventListener('click', function (e) { e.stopPropagation(); openCard(o); });
      markers.push(new mapboxgl.Marker({ element: wrap }).setLngLat(o.coords).addTo(map));
    });
    if (fitFor !== mode) { fitFor = mode; fit(list.map(function (o) { return o.coords; })); }
  }

  function renderCats() {
    var counts = {}; spots.forEach(function (s) { counts[s.cat] = (counts[s.cat] || 0) + 1; });
    $('pmx-cats').innerHTML = Object.keys(CATS).map(function (k) {
      var c = CATS[k];
      return '<button type="button" class="pmx-cat" data-cat="' + k + '" aria-pressed="' + !!cats[k] + '" style="--c:' + c.c + '">' + c.e + ' ' + esc(L(c)) + ' <span style="opacity:.7">' + (counts[k] || 0) + '</span></button>';
    }).join('');
  }

  function filteredSpots() {
    var any = Object.keys(cats).some(function (k) { return cats[k]; }), q = query.trim().toLowerCase();
    return spots.filter(function (s) {
      return (!any || cats[s.cat]) && (!q || s.name.toLowerCase().indexOf(q) > -1 || s.city.toLowerCase().indexOf(q) > -1 || s.desc.toLowerCase().indexOf(q) > -1);
    });
  }

  function renderAll() {
    var list = filteredSpots(), vis = rd('marlon_visited_spots'), st = rd('marlon_stamps');
    map.getSource('pmx-all').setData({ type: 'FeatureCollection', features: list.map(function (s) {
      var done = vis.indexOf(s.id) > -1;
      return { type: 'Feature', geometry: { type: 'Point', coordinates: s.coords }, properties: { id: s.id, ic: 'pmx-' + s.cat + (done ? '-s' : '') } };
    }) });
    $('pmx-count').textContent = T.places(list.length);
    $('pmx-alist').innerHTML = list.slice(0, shown).map(function (s) {
      var c = cat(s.cat);
      return '<li><button type="button" data-key="' + esc(s.id) + '"><span class="pmx-ic" style="--c:' + c.c + '">' + c.e + '</span><span class="pmx-li-t"><b>' + esc(s.name) + '</b><small>' + esc(L(c)) + ' · ' + esc(s.city) + '</small></span></button></li>';
    }).join('');
    $('pmx-more').hidden = list.length <= shown; $('pmx-more').textContent = T.more;
    if (fitFor !== 'all:' + list.length) { fitFor = 'all:' + list.length; if (list.length && list.length < spots.length) fit(list.map(function (s) { return s.coords; })); else if (fitFor) map.easeTo({ center: [-118.2437, 34.0522], zoom: 9.6, duration: 600 }); }
  }

  /* ---------- the place card ---------- */
  function openByKey(key) {
    if (mode !== 'all') { var o = stops(pp(mode)).filter(function (x) { return x.key === key; })[0]; if (o) return openCard(o); }
    if (byId[key]) return openCard(placeFromSpot(byId[key]));
    var st = stampObj(key);
    if (st && st.location) openCard({ key: key, name: L(st.label), cat: 'landmarks', city: st.location.address || '', desc: '', coords: st.location.coordinates });
  }

  function openCard(o, still) {
    card = o;
    var c = cat(o.cat), st = o.st || stampObj(o.key), members = memberOf(o.key), on = st ? stamped(st) : false;
    var ink = (members[0] && members[0].ink) || '#27302E';
    var names = members.map(function (p) { return L(p.name); }).join(' · ');
    var dir = 'https://www.google.com/maps/dir/?api=1&destination=' + o.coords[1] + ',' + o.coords[0];
    var h = '<button type="button" class="pmx-x" data-close aria-label="Close">×</button>' +
      '<span class="pmx-type" style="--c:' + c.c + '">' + c.e + ' ' + esc(L(c)) + '</span>' +
      '<h3>' + esc(o.name) + '</h3>' + (o.city ? '<div class="pmx-city">📍 ' + esc(o.city) + '</div>' : '') +
      (o.desc ? '<p>' + esc(o.desc) + '</p>' : '<div style="height:8px"></div>');
    if (st) {
      h += '<div class="pmx-stamp' + (on ? ' on' : '') + '" style="--ink:' + esc(ink) + '"><span class="pmx-seal">' + (on ? '✓' : '🎫') + '</span><div><b>' + esc(on ? T.stampedIn : T.stampFor) + ' ' + esc(names) + '</b><small>' + esc(on ? T.stampedNote : T.goNote) + '</small></div></div>';
      h += on ? '' : '<button type="button" class="pmx-b main" data-stamp="1">' + esc(T.stampIt) + '</button>';
    } else {
      h += '<p style="color:#64748b;font-size:.85rem;margin-top:0">' + esc(T.noPP) + '</p>';
    }
    h += '<div class="pmx-acts"><a class="pmx-b" href="' + dir + '" target="_blank" rel="noopener">🚗 ' + esc(T.dir) + '</a>' +
      (STORY[o.key] ? '<a class="pmx-b" href="' + STORY[o.key] + '">📖 ' + esc(T.story) + '</a>' : '') + '</div>' +
      (st && on ? '<button type="button" class="pmx-b quiet" data-stamp="0">' + esc(T.unstamp) + '</button>' : '');
    var el = $('pmx-card'); el.innerHTML = h; el.hidden = false; el.scrollTop = 0;
    var phone = window.innerWidth < 900;
    map.easeTo({ center: o.coords, zoom: Math.max(map.getZoom(), 14), offset: phone ? [0, 0] : [180, 0], duration: 600 });
    /* phones: the card sits under the map; scroll so the pin and the card are both in view */
    if (phone && !still) {
      var r = el.getBoundingClientRect(), m = $('pmx-map').getBoundingClientRect(), pinY = m.top + m.height / 2;
      var dy = Math.min(r.bottom - window.innerHeight + 12, pinY - 90);
      if (Math.abs(dy) > 4) window.scrollBy({ top: dy, behavior: 'smooth' });
    }
    if (mode !== 'all') renderPassport();
  }

  function closeCard() { card = null; $('pmx-card').hidden = true; if (mode !== 'all') renderPassport(); }

  /* ---------- events ---------- */
  root.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-mode')) { mode = b.getAttribute('data-mode'); fitFor = ''; closeCard(); shown = 40; render(); return; }
    if (b.hasAttribute('data-cat')) { var k = b.getAttribute('data-cat'); cats[k] = !cats[k]; shown = 40; renderCats(); renderAll(); return; }
    if (b.id === 'pmx-more') { shown += 40; renderAll(); return; }
    if (b.hasAttribute('data-close')) { closeCard(); return; }
    if (b.hasAttribute('data-stamp') && card) {
      var st = card.st || stampObj(card.key); if (!st) return;
      setStamp(st, b.getAttribute('data-stamp') === '1');
      renderTabs(); if (mode === 'all') renderAll();
      openCard(card, true); return;
    }
    if (b.hasAttribute('data-key')) {
      openByKey(b.getAttribute('data-key'));
    }
  });
  var qt;
  $('pmx-q').addEventListener('input', function () { clearTimeout(qt); qt = setTimeout(function () { query = $('pmx-q').value; shown = 40; renderAll(); }, 150); });
  window.addEventListener('storage', function (e) { if (e.key === 'marlon_visited_spots' || e.key === 'marlon_stamps') { renderTabs(); if (mode === 'all') renderAll(); else renderPassport(); } });

  start();
})();
</script>
