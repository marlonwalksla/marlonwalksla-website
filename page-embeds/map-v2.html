<!-- ==============================================================================
     MARLONWALKSLA - PASSPORT MAP (v2)   Oct 26, 2026
     A fresh map built around passports. Replaces Explore/Trip, pins/visited, the quiz.
     Loaded into <div id="fp-host"> by the page footer code (test branch on the test site).
     Data: spots.geojson + passport-collections.json from the repo (@main).
     Stamps share the passport page's storage: marlon_visited_spots (stamps with a map pin)
     and marlon_stamps (stamps without a pin), so stamping in one shows in the other.
     Links: ?passport=la-tourist | downtown-classic | all   &spot=<slug>   &lang=es
     Classes all start with pmx- (Webflow has its own short class names, see the .tp bug).
     ============================================================================== -->

    $('pmx-pp').hidden = isAll; $('pmx-all').hidden = !isAll;
    ['pmx-clusters', 'pmx-count', 'pmx-pts'].forEach(function (l) { if (map && map.getLayer(l)) map.setLayoutProperty(l, 'visibility', isAll ? 'visible' : 'none'); });
    if (isAll) { clearMarkers(); $('pmx-fit').hidden = true; renderCats(); renderAll(); } else renderPassport();
    try { var u = new URL(location.href); u.searchParams.set('passport', mode); history.replaceState(null, '', u.toString()); } catch (e) {}
  }

  var menuOpen = false, lastPP = '', flipDir = 0, swiped = false;
  function flip(d) {
    var livePs = pps.filter(live); if (livePs.length < 2) return;
    var i = livePs.indexOf(pp(mode)), nx = livePs[(i + d + livePs.length) % livePs.length];
    menuOpen = false; flipDir = d; mode = nx.id; fitFor = ''; closeCard(); shown = 40; render(); flipDir = 0;
  }
  function renderTabs() {
    var isAll = mode === 'all', cur = isAll ? pp(lastPP) : pp(mode);
    if (!isAll) lastPP = mode;
    var h = '<div class="pmx-seg" role="group" aria-label="' + esc(T.pps + ' / ' + T.all) + '">' +
      '<button type="button" data-view="pp" aria-pressed="' + !isAll + '">🎫 ' + esc(T.pps) + '</button>' +
      '<button type="button" data-view="all" aria-pressed="' + isAll + '">🗺️ ' + esc(T.all) + ' <em>' + spots.length + '</em></button></div>';
    if (!isAll && cur) {
      var ci = pps.indexOf(cur), n2 = pps[(ci + 1) % pps.length], n3 = pps[(ci + 2) % pps.length];
      var livePs = pps.filter(live), li = livePs.indexOf(cur);
      h += '<div class="pmx-deck"><div class="pmx-flip"><button type="button" data-flip="-1" aria-label="' + esc(T.prevP) + '">‹</button><span>' + (li + 1) + '/' + livePs.length + '</span><button type="button" data-flip="1" aria-label="' + esc(T.nextP) + '">›</button></div>';
      h += '<button type="button" class="pmx-pick' + (flipDir ? (flipDir > 0 ? ' pmx-in-r' : ' pmx-in-l') : '') + '" id="pmx-pick" aria-haspopup="true" aria-expanded="' + menuOpen + '" aria-controls="pmx-menu" style="--ink:' + esc(cur.ink || '#27302E') + ';--ink2:' + esc((n2 && n2.ink) || '#27302E') + ';--ink3:' + esc((n3 && n3.ink) || '#27302E') + '">' +
        '<span class="pmx-ftab">🎫 ' + esc(T.pick(pps.length)) + ' <i aria-hidden="true">▾</i></span>' +
        '<span class="pmx-dot"></span><b>' + esc(L(cur.name)) + '</b><span class="pmx-chev" aria-hidden="true">▾</span>' +
        (function () { var g = prog(cur); return '<span class="pmx-pick-p"><span class="pmx-mini"><i style="width:' + (g.t ? Math.round(g.d / g.t * 100) : 0) + '%"></i></span><small>' + esc(T.of(g.d, g.t)) + '</small></span>'; })() + '</button></div>';
      h += '<div class="pmx-menu" id="pmx-menu"' + (menuOpen ? '' : ' hidden') + '><div class="pmx-menu-h">' + esc(T.choose) + '</div>' + pps.map(function (p) {
        var ok = live(p), g = prog(p), pct = g.t ? Math.round(g.d / g.t * 100) : 0;
        return '<button type="button" class="pmx-opt" data-mode="' + esc(p.id) + '"' + (p.id === mode ? ' aria-current="true"' : '') + (ok ? '' : ' disabled') + ' style="--ink:' + esc(p.ink || '#27302E') + '">' +
          '<span class="pmx-dot"></span><b>' + esc(L(p.name)) + '</b><small>' + (ok ? g.d + '/' + g.t : esc(T.soon)) + '</small>' +
          '<span class="pmx-mini"><i style="width:' + pct + '%"></i></span></button>';
      }).join('') + '</div>';
    }
    $('pmx-tabs').innerHTML = h;
  }
  function setMenu(open) {
    menuOpen = open; var m = $('pmx-menu'), b = $('pmx-pick');
    if (m) m.hidden = !open; if (b) b.setAttribute('aria-expanded', String(open));
    if (open && m) { var c = m.querySelector('[aria-current="true"]') || m.querySelector('.pmx-opt'); if (c) c.focus(); }
  }

  function renderPassport() {
    var p = pp(mode); if (!p) return;
    var ink = p.ink || '#27302E', list = stops(p), g = prog(p), page = PPAGE[p.id] || '/passports?passport=' + encodeURIComponent(p.id);
    if (ES) page = page.replace('/passports', '/pasaportes');
    root.style.setProperty('--ink', ink);
    var h = '';
    h += '<ol class="pmx-list">' + list.map(function (o) {
      var on = stamped(o.st), c = cat(o.cat);
      if (!o.coords) return '<li><div class="pmx-row-x"><span class="pmx-num' + (on ? ' on' : '') + '">' + (on ? '✓' : o.n) + '</span><span class="pmx-li-t"><b>' + esc(o.name) + '</b><small>✨ ' + esc(T.anywhere) + '</small></span></div></li>';
      return '<li><button type="button" data-key="' + esc(o.key) + '"><span class="pmx-num' + (on ? ' on' : '') + '">' + (on ? '✓' : o.n) + '</span><span class="pmx-li-t"><b>' + esc(o.name) + '</b><small>' + c.e + ' ' + esc(L(c)) + (o.city ? ' · ' + esc(o.city) : '') + '</small></span>' + (function () { var n = bonusCount(p, o.st); return n ? '<span class="pmx-bn">' + esc(T.plusBonus(n)) + '</span>' : ''; })() + '</button></li>';
    }).join('') + '</ol>';
    if (g.t && g.d === g.t) h += '<div class="pmx-done">🎉 ' + esc(T.done) + '</div>';
    h += '<div class="pmx-after"><a class="pmx-open" href="' + page + (ES ? (page.indexOf('?') < 0 ? '?' : '&') + 'lang=es' : '') + '">' + esc(T.open) + ' →</a></div>';
    $('pmx-pp').innerHTML = h;
    var fb = $('pmx-fit'); if (fb) { fb.hidden = !map || !list.some(function (o) { return o.coords; }); fb.textContent = '⤢ ' + T.showAll(list.filter(function (o) { return o.coords; }).length); }
    clearMarkers();
    if (map && window.mapboxgl) list.filter(function (o) { return o.coords; }).forEach(function (o) {
      var on = stamped(o.st), wrap = document.createElement('div'), pin = document.createElement('div');
      pin.className = 'pmx-pin' + (on ? ' on' : '') + (card && card.key === o.key ? ' sel' : '');
      pin.style.setProperty('--ink', ink); pin.textContent = on ? '✓' : o.n; pin.title = o.name;
      wrap.appendChild(pin);
      wrap.addEventListener('click', function (e) { e.stopPropagation(); openCard(o); });
      markers.push(new mapboxgl.Marker({ element: wrap }).setLngLat(o.coords).addTo(map));
    });
    if (fitFor !== mode) { fitFor = mode; fit(list.filter(function (o) { return o.coords; }).map(function (o) { return o.coords; })); }
  }

  function renderCats() {
    var counts = {}; spots.forEach(function (s) { counts[s.cat] = (counts[s.cat] || 0) + 1; });
    $('pmx-cats').innerHTML = Object.keys(CATS).map(function (k) {
      var c = CATS[k];
      return '<button type="button" class="pmx-cat" data-cat="' + k + '" aria-pressed="' + !!cats[k] + '" style="--c:' + c.c + '">' + c.e + ' ' + esc(L(c)) + ' <span style="opacity:.7">' + (counts[k] || 0) + '</span></button>';
    }).join('');
  }

  function filteredSpots() {
    var any = Object.keys(cats).some(function (k) { return cats[k]; }), q = query.trim().toLowerCase();
    return spots.filter(function (s) {
      return (!any || cats[s.cat]) && (!q || s.name.toLowerCase().indexOf(q) > -1 || s.city.toLowerCase().indexOf(q) > -1 || s.desc.toLowerCase().indexOf(q) > -1);
    });
  }

  function renderAll() {
    var list = filteredSpots(), vis = rd('marlon_visited_spots'), st = rd('marlon_stamps');
    if (map && map.getSource('pmx-all')) map.getSource('pmx-all').setData({ type: 'FeatureCollection', features: list.map(function (s) {
      var done = vis.indexOf(s.id) > -1;
      return { type: 'Feature', geometry: { type: 'Point', coordinates: s.coords }, properties: { id: s.id, ic: 'pmx-' + s.cat + (done ? '-s' : '') } };
    }) });
    $('pmx-count').textContent = T.places(list.length);
    $('pmx-alist').innerHTML = list.slice(0, shown).map(function (s) {
      var c = cat(s.cat);
      return '<li><button type="button" data-key="' + esc(s.id) + '"><span class="pmx-ic" style="--c:' + c.c + '">' + c.e + '</span><span class="pmx-li-t"><b>' + esc(s.name) + '</b><small>' + esc(L(c)) + ' · ' + esc(s.city) + '</small></span></button></li>';
    }).join('');
    $('pmx-more').hidden = list.length <= shown; $('pmx-more').textContent = T.more;
    if (fitFor !== 'all:' + list.length) { fitFor = 'all:' + list.length; if (list.length && list.length < spots.length) fit(list.map(function (s) { return s.coords; })); else if (fitFor && map) map.easeTo({ center: [-118.2437, 34.0522], zoom: 9.6, duration: 600 }); }
  }

  /* ---------- the place card ---------- */
  function openByKey(key) {
    if (mode !== 'all') { var o = stops(pp(mode)).filter(function (x) { return x.coords && same(x.key, key); })[0]; if (o) return openCard(o); }
    if (spotOf(key)) return openCard(placeFromSpot(spotOf(key)));
    var st = stampObj(key);
    if (st && st.location) openCard({ key: key, name: L(st.label), cat: 'landmarks', city: st.location.address || '', desc: '', coords: st.location.coordinates });
  }

  function openCard(o, still, pressed) {
    card = o;
    var c = cat(o.cat), st = o.st || stampObj(o.key), members = memberOf(o.key), on = st ? stamped(st) : false;
    var ink = (members[0] && members[0].ink) || '#27302E';
    var names = members.map(function (p) { return L(p.name); }).join(' · ');
    var dir = 'https://www.google.com/maps/dir/?api=1&destination=' + o.coords[1] + ',' + o.coords[0];
    var sv = st ? stampSvg(o, members) : '';
    var h = '<button type="button" class="pmx-x" data-close aria-label="Close">×</button>' +
      (sv ? '<div class="pmx-corner' + (on ? ' on' : '') + '" aria-hidden="true" style="color:' + esc(ink) + '">' + sv + '</div>' : '') +
      '<span class="pmx-type" style="--c:' + c.c + '">' + c.e + ' ' + esc(L(c)) + '</span>' +
      '<h3>' + esc(o.name) + '</h3>' + (o.city ? '<div class="pmx-city">📍 ' + esc(o.city) + '</div>' : '') +
      (o.desc ? '<p>' + esc(o.desc) + '</p>' : '<div style="height:8px"></div>');
    if (st) {
      /* Nov 6, 2026: one toggle button. Tap to stamp, tap again to remove. */
      h += '<button type="button" class="pmx-go' + (on ? ' on' : '') + '" data-stamp="' + (on ? '0' : '1') + '" aria-pressed="' + on + '" style="--ink:' + esc(ink) + '"><span class="pmx-seal">' + (on ? '✓' : '🎫') + '</span><span class="pmx-go-t"><b>' + esc(on ? T.stampedBtn : T.stampIt) + '</b><small>' + esc(on ? T.tapRemove : names) + '</small></span></button>';
      var bs = bonusOf(o, members);
      if (bs.length) {
        h += '<div class="pmx-bonus"><div class="pmx-bonus-h">⭐ ' + esc(T.bonusH) + ' <span>' + bs.filter(function (b) { return hasB(b.S); }).length + '/' + bs.length + '</span></div>' + bs.map(function (b, i) {
          var S = b.S, got = hasB(S), sv = '';
          try { sv = MWStamp.svg({ uid: 'pmxb' + i, top: L(S.top), bottom: L(S.bottom), icon: S.icon, year: S.year, ink: S.ink || b.P.ink, rot: S.rot, seed: S.seed }); } catch (e) {}
          return '<button type="button" class="pmx-bt' + (got ? ' on' : '') + '" data-bonus="' + esc(S.id) + '" aria-pressed="' + got + '" style="--ink:' + esc(S.ink || b.P.ink || ink) + '">' +
            '<span class="pmx-bt-s" aria-hidden="true" style="color:' + esc(S.ink || b.P.ink || ink) + '">' + sv + '</span>' +
            '<span class="pmx-bt-t"><b>' + esc(L(S.name)) + '</b>' + (L(S.challenge) ? '<small>' + esc(L(S.challenge)) + '</small>' : '') + '</span>' +
            '<span class="pmx-bt-c" aria-hidden="true">' + (got ? '✓' : '') + '</span></button>';
        }).join('') + '</div>';
      }
    } else {
      h += '<p style="color:#64748b;font-size:.85rem;margin-top:0">' + esc(T.noPP) + '</p>';
    }
    h += '<div class="pmx-acts"><a class="pmx-b" href="' + dir + '" target="_blank" rel="noopener">🚗 ' + esc(T.dir) + '</a>' +
      (STORY[(spotOf(o.key) || {}).id || o.key] ? '<a class="pmx-b" href="' + STORY[(spotOf(o.key) || {}).id || o.key] + '">📖 ' + esc(T.story) + '</a>' : '') + '</div>' +
      '';
    var el = $('pmx-card'); el.innerHTML = h; el.hidden = false; if (!still) el.scrollTop = 0;
    el.classList.toggle('has-corner', !!sv);
    if (pressed === 'press' && on && window.MWStamp) { var cn = el.querySelector('.pmx-corner'); if (cn) { MWStamp.press(cn); MWStamp.burst(cn, [ink, '#FFD43B', '#27302E']); } }
    var phone = window.innerWidth < 900;
    if (map) map.easeTo({ center: o.coords, zoom: Math.max(map.getZoom(), 14), offset: phone ? [0, 0] : [180, 0], duration: 600 }); else ensureMap();
    /* phones: the card sits under the map; scroll so the pin and the card are both in view */
    if (phone && !still) {
      var r = el.getBoundingClientRect(), m = $('pmx-map').getBoundingClientRect(), pinY = m.top + m.height / 2;
      var dy = Math.min(r.bottom - window.innerHeight + 12, pinY - 90);
      if (Math.abs(dy) > 4) window.scrollBy({ top: dy, behavior: 'smooth' });
    }
    if (mode !== 'all') renderPassport();
  }

  /* Nov 6, 2026: the real passport stamp sits in the card's top-right corner (faint until stamped). Same drawing as /passports. */
  var art = null, artLoading = null;
  function loadArt() {
    if (art || artLoading) return artLoading;
    artLoading = new Promise(function (res, rej) {
      if (window.MWStamp) return res();
      var sc = document.createElement('script'); sc.src = BASE + 'stamp-lib.js'; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc);
    }).then(function () { return Promise.all([getJSON(BASE + 'passports.json'), MWStamp.load(BASE)]); })
      .then(function (r) { art = r[0].passports || []; if (card) openCard(card, true, true); else if (mode !== 'all') renderPassport(); })
      .catch(function () { art = []; });
    return artLoading;
  }
  /* Nov 6, 2026: bonus stamps (passports.json, bonus:true, parent:<stamp id>) shown and collected on the place card. */
  function bonusOf(o, members) {
    if (!art || !o.st) return [];
    var out = [];
    members.forEach(function (m) {
      var P = art.filter(function (x) { return x.id === m.id; })[0];
      (P && P.stamps || []).forEach(function (S) { if (S.bonus && S.parent === o.st.id && !S.draft) out.push({ S: S, P: P }); });
    });
    return out;
  }
  function hasB(S) { return rd('marlon_stamps').indexOf(S.id) > -1; }
  function setB(S, on) { var a = rd('marlon_stamps'), i = a.indexOf(S.id); if (on && i < 0) a.push(S.id); if (!on && i > -1) a.splice(i, 1); wr('marlon_stamps', a); }
  function bonusCount(p, st) {
    if (!art) return 0; var P = art.filter(function (x) { return x.id === p.id; })[0];
    return (P && P.stamps || []).filter(function (S) { return S.bonus && S.parent === st.id && !S.draft; }).length;
  }

  function stampSvg(o, members) {
    if (!art || !window.MWStamp) { loadArt(); return ''; }
    for (var i = 0; i < members.length; i++) {
      var P = art.filter(function (x) { return x.id === members[i].id; })[0];
      var S = P && (P.stamps || []).filter(function (x) { return x.id === (o.st || {}).id || same(x.mapId || x.legacyKey || x.id, o.key); })[0];
      if (S) { try { return MWStamp.svg({ uid: 'pmxs', top: L(S.top), bottom: L(S.bottom), icon: S.icon, year: S.year, ink: S.ink || P.ink, rot: S.rot, seed: S.seed }); } catch (e) { return ''; } }
    }
    return '';
  }

  function closeCard(refit) { card = null; $('pmx-card').hidden = true; if (mode !== 'all') { if (refit) fitFor = ''; renderPassport(); } }

  /* ---------- events ---------- */
  root.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (menuOpen && !(b && (b.id === 'pmx-pick' || b.classList.contains('pmx-opt')))) setMenu(false);
    if (!b) return;
    if (b.id === 'pmx-pick') { if (swiped) { swiped = false; return; } setMenu(!menuOpen); return; }
    if (b.hasAttribute('data-flip')) { flip(+b.getAttribute('data-flip')); return; }
    if (b.hasAttribute('data-view')) {
      var v = b.getAttribute('data-view'), next = v === 'all' ? 'all' : (lastPP && live(pp(lastPP)) ? lastPP : (pps.filter(live)[0] || {}).id);
      if (next && next !== mode) { mode = next; fitFor = ''; closeCard(); shown = 40; render(); }
      return;
    }
    if (b.hasAttribute('data-mode')) { menuOpen = false; mode = b.getAttribute('data-mode'); fitFor = ''; closeCard(); shown = 40; render(); var pk = $('pmx-pick'); if (pk) pk.focus(); return; }
    if (b.hasAttribute('data-cat')) { var k = b.getAttribute('data-cat'); cats[k] = !cats[k]; shown = 40; renderCats(); renderAll(); return; }
    if (b.id === 'pmx-more') { shown += 40; renderAll(); return; }
    if (b.hasAttribute('data-close')) { closeCard(true); return; }
    if (b.id === 'pmx-fit') { closeCard(true); return; }
    if (b.hasAttribute('data-bonus') && card && art) {
      var bid = b.getAttribute('data-bonus'), S = null;
      art.forEach(function (P) { (P.stamps || []).forEach(function (x) { if (x.id === bid && x.bonus) S = x; }); });
      if (S) { var now = !hasB(S); setB(S, now); openCard(card, true);
        if (now && window.MWStamp) { var nb = $('pmx-card').querySelector('[data-bonus="' + bid + '"] .pmx-bt-s'); if (nb) { MWStamp.press(nb); MWStamp.burst(nb, ['#FFD43B', '#27302E']); } } }
      return;
    }
    if (b.hasAttribute('data-stamp') && card) {
      var st = card.st || stampObj(card.key); if (!st) return;
      setStamp(st, b.getAttribute('data-stamp') === '1');
      renderTabs(); if (mode === 'all') renderAll();
      openCard(card, true, 'press'); return;
    }
    if (b.hasAttribute('data-key')) {
      openByKey(b.getAttribute('data-key'));
    }
  });
  document.addEventListener('click', function (e) { if (menuOpen && !root.contains(e.target)) setMenu(false); });
  root.addEventListener('keydown', function (e) { if (e.key === 'Escape' && menuOpen) { setMenu(false); var pk = $('pmx-pick'); if (pk) pk.focus(); } });
  var sx = 0, sy = 0;
  root.addEventListener('touchstart', function (e) { if (!e.target.closest('#pmx-pick')) return; sx = e.touches[0].clientX; sy = e.touches[0].clientY; swiped = false; }, { passive: true });
  root.addEventListener('touchend', function (e) {
    if (!e.target.closest('#pmx-pick') || !sx) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = 0;
    if (Math.abs(dx) > 45 && Math.abs(dy) < 40) { swiped = true; flip(dx < 0 ? 1 : -1); setTimeout(function () { swiped = false; }, 400); }
  }, { passive: true });
  var qt;
  $('pmx-q').addEventListener('input', function () { clearTimeout(qt); qt = setTimeout(function () { query = $('pmx-q').value; shown = 40; renderAll(); }, 150); });
  window.addEventListener('storage', function (e) { if (e.key === 'marlon_visited_spots' || e.key === 'marlon_stamps') { renderTabs(); if (mode === 'all') renderAll(); else renderPassport(); } });

  start();
})();
</script>
