<script>
  (function () {
    var nums = document.querySelectorAll('.rv-banner .rv-num[data-count]');
    if (!nums.length || !('IntersectionObserver' in window)) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var banner = document.querySelector('.rv-banner');
    var done = false;
    new IntersectionObserver(function (entries, obs) {
      if (done || !entries[0].isIntersecting) return;
      done = true; obs.disconnect();
      nums.forEach(function (el) {
        var end = parseInt(el.getAttribute('data-count'), 10), t0 = null;
        el.style.minWidth = el.offsetWidth + 'px';
        function step(ts) {
          if (!t0) t0 = ts;
          var p = Math.min((ts - t0) / 1400, 1), e = 1 - Math.pow(1 - p, 3);
          el.textContent = Math.round(end * e);
          if (p < 1) requestAnimationFrame(step); else el.textContent = end;
        }
        requestAnimationFrame(step);
      });
    }, { threshold: 0.4 }).observe(banner);
  })();
</script>
