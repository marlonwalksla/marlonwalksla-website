<!-- Team tour booking calendar (Cal.com: marlonwalksla/group-tours).
     Lives inside the .mw-form-card on Home, /es and the Team page (same embed on all three).
     The old Webflow "Team Tour Inquiry" form + its title/sub/note are hidden (not deleted) on those pages.
     Language comes from <html lang>. -->
<div class="tcal" id="tcal">
  <div class="tcal-box" id="tcal-inline"><p class="tcal-loading" data-en="Loading calendar&hellip;" data-es="Cargando calendario&hellip;">Loading calendar&hellip;</p></div>
</div>
<style>
  .tcal { width: 100%; }
  .mw-form-card:has(.tcal) > .w-form { display: none !important; }
  /* Oct 16, 2026: the 48px top margin was room for Ernesto peeking over the card (he is hidden now). It pushed the calendar below the left column. */
  .mw-form-card:has(.tcal) { margin-top: 0; padding: 18px; }
  .tcal-title { font-family: "Lilita One", sans-serif; font-weight: 400; font-size: 1.6rem; line-height: 1.15; margin: 0 0 12px; color: #27302E; }
  .tcal-sub { font-family: "Fredoka", "Nunito", sans-serif; font-size: 1rem; line-height: 1.45; margin: 0 0 14px; color: #3B4440; }
  .tcal-box { min-height: 520px; border-radius: 12px; overflow: hidden; background: #fff; }
  .tcal-loading { padding: 40px 16px; text-align: center; color: #6B7370; font-size: 0.95rem; margin: 0; }
  .tcal-note { margin: 14px 0 0; font-size: 0.95rem; line-height: 1.5; color: #3B4440; }
  .tcal-note a { color: #1B6688 !important; font-weight: 700; text-decoration: underline; }
</style>
<script>
(function () {
  var es = (document.documentElement.lang || "").toLowerCase().indexOf("es") === 0;
  var root = document.getElementById("tcal");
  if (!root) return;
  var card = root.closest(".mw-form-card"), oldForm = card && card.querySelector(".w-form");
  if (oldForm) oldForm.style.display = "none";
  if (es) root.querySelectorAll("[data-es]").forEach(function (el) { el.innerHTML = el.getAttribute("data-es"); });
  (function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if (typeof namespace === "string") { cal.ns[namespace] = cal.ns[namespace] || api; p(cal.ns[namespace], ar); p(cal, ["initNamespace", namespace]); } else p(cal, ar); return; } p(cal, ar); }; })(window, "https://app.cal.com/embed/embed.js", "init");
  var done = false;
  function load() {
    if (done) return; done = true;
    var box = document.getElementById("tcal-inline"); box.innerHTML = "";
    Cal("init", "group-tours", { origin: "https://app.cal.com" });
    Cal.ns["group-tours"]("inline", { elementOrSelector: "#tcal-inline", config: { layout: "month_view", theme: "light" }, calLink: "marlonwalksla/group-tours" });
    Cal.ns["group-tours"]("ui", { theme: "light", hideEventTypeDetails: true, layout: "month_view" }); // Oct 16, 2026: no title/length/location/time zone panel, the page already says it
  }
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (e) { if (e[0].isIntersecting) { io.disconnect(); load(); } }, { rootMargin: "600px" });
    io.observe(root);
  } else load();
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ==============================================================================
 * REPLY POSTCARDS (Oct 17, 2026, late; Marlon: "when filling in information it's like you're sending me a postcard")
 * Every booking/inquiry card (.mw-form-card: Home team price card, Home and Private page inquiry form,
 * Team page calendar) looks like the back of a postcard addressed to Marlon: airmail edge, an Ernesto stamp,
 * handwritten labels and ruled lines instead of boxes. Native Webflow forms, so submissions work as before.
 * ============================================================================== */
.mw-form-card {
  --pc-edge: repeating-linear-gradient(-45deg, #D93A2B 0 12px, #FFFDF7 12px 20px, #2890B6 20px 32px, #FFFDF7 32px 40px);
  position: relative;
  min-width: 0;
  background: #FFFDF7 !important;
  border: 10px solid transparent !important;
  border-image: var(--pc-edge) 10 !important;
  border-radius: 0 !important;
  box-shadow: 0 16px 32px -20px rgba(39, 48, 46, 0.65) !important;
}
.mw-bg-team .mw-form-card { --pc-edge: repeating-linear-gradient(-45deg, #E8412F 0 12px, #FFFDF7 12px 20px, #2890B6 20px 32px, #FFFDF7 32px 40px); }
.mw-bg-private .mw-form-card { --pc-edge: repeating-linear-gradient(-45deg, #2890B6 0 12px, #FFFDF7 12px 20px, #FFD43B 20px 32px, #FFFDF7 32px 40px); }
/* Ernesto is the stamp */
.mw-form-card::after {
  content: "" !important;
  position: absolute; top: 12px; right: 12px; width: 58px; height: 70px; padding: 6px; box-sizing: border-box;
  background: url("https://cdn.prod.website-files.com/6a050f29c558b4d909196aad/6a87ce84d9af8f7c9bf12030_Tour%20Guide.avif") center 60% / 40px auto no-repeat content-box, linear-gradient(#FFF1C9, #FFF1C9) content-box, #fff;
  -webkit-mask: radial-gradient(circle at center, transparent 2.6px, #000 3px) -4px -4px / 8px 8px, linear-gradient(#000 0 0) content-box;
  mask: radial-gradient(circle at center, transparent 2.6px, #000 3px) -4px -4px / 8px 8px, linear-gradient(#000 0 0) content-box;
  transform: rotate(4deg); pointer-events: none;
}
.mw-form-card:has(.tcal)::after { display: none; }
.mw-form-card .mw-form-title, .mw-form-card .tq-title, .mw-form-card .mw-form-sub { padding-right: 64px; }
/* Handwritten labels, ruled lines instead of boxes */
.mw-form-card .mw-form-label { font-family: "Caveat", cursive !important; font-weight: 700 !important; font-size: 1.3rem !important; line-height: 1.1 !important; color: #3B4440 !important; margin: 12px 0 0 !important; text-transform: none !important; letter-spacing: 0 !important; }

  font-family: "Caveat", cursive !important; font-weight: 600; font-size: 1.45rem !important; color: #1F2A44 !important;
}
