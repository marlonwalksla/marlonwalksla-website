<!-- MARLONWALKSLA - LA GUIDES (Nov 28, 2026, round 1). One section for the /guides hub (ES /guias) and every guide page
     (/guides/<slug>, ES /guias/<slug>). Loaded by the one-line mw.js embed (data-s="guides") on those four Webflow pages.
     Webflow CMS (collections "Guides" and "Guides (ES)") holds each guide page's headline, intro and SEO text in a
     hidden .mwg-src block (data-guide = the guide id); this file moves that real text into the layout.
     Data: guides.json (built by tools/build_guides_json.py) + stamp-icons.json + stamp-lib.js.
     Stamps share the map's browser storage: marlon_visited_spots (places with a pin, both the pin id and the old name)
     and marlon_stamps (no pin). So stamping here marks the place on /maps too, and old stamps show up here.
     Map: an illustrated postcard map drawn from the real coordinates; "Open the real map" swaps in Mapbox. -->

    var qs = new URLSearchParams(location.search), sk = qs.get('spot'), sp = sk ? G.stops.filter(function (x) { return ids(x).indexOf(sk) > -1 || x.id === sk; })[0] : null;
    var q = qs.get('stop') || (sp ? String(sp.n) : ''), hm = (location.hash.match(/^#stop-(\d+)$/) || [])[1], dn = +(q || hm || 0);
    if (dn && G.stops[dn - 1]) { history.replaceState(null, '', location.pathname); setTimeout(function () { openStop(dn, 'link'); }, 150); }
  }

  /* ---------- map: drawn map first (instant), then the real Mapbox map ---------- */
  function drawMap() {
    if (mbReady) return drawMarkers();
    var m = document.getElementById('mwg-map');
    m.innerHTML = mapSvg(G, 600, 420, { uid: 'g' });
    m.querySelectorAll('.mwg-pin').forEach(function (p) {
      var pn = +p.getAttribute('data-n');
      if (pn === selectedStopId) p.classList.add('sel');
      function go() { ga('guide_pin_select', { guide: G.id, stop: G.stops[pn - 1].id, n: pn, map: 'drawn' }); openStop(pn, 'pin'); }
      p.addEventListener('click', go); p.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    });
  }
  function loadMapbox() {
    if (window.mapboxgl) return Promise.resolve();
    return new Promise(function (res, rej) {
      var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css'; document.head.appendChild(l);
      var s = document.createElement('script'); s.src = 'https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s);
    });
  }
  function padding() { return window.innerWidth < 900 ? { top: 64, bottom: 40, left: 40, right: 56 } : { top: 70, bottom: 50, left: 60, right: 70 }; }
  function fitAll(anim) {
    if (!mbMap) return;
    var b = new mapboxgl.LngLatBounds(); G.stops.forEach(function (s) { if (s.coords) b.extend(s.coords); });
    mbMap.fitBounds(b, { padding: padding(), maxZoom: 14, duration: anim ? 600 : 0 });
  }
  function mountMapbox() {
    var m = document.getElementById('mwg-map'), keep = m.innerHTML;
    m.innerHTML = '<div class="mwg-mb5" id="mwg-mb"></div>';
    try {
      mapboxgl.accessToken = TOKEN;
      mbMap = new mapboxgl.Map({ container: 'mwg-mb', style: 'mapbox://styles/mapbox/streets-v12', center: [-118.35, 34.07], zoom: 9.6, cooperativeGestures: window.innerWidth < 900, attributionControl: true });
      mbMap.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'top-right');
      mbMap.addControl(new mapboxgl.GeolocateControl({ positionOptions: { enableHighAccuracy: true }, trackUserLocation: true }), 'top-right');
      mbReady = true; fitAll(false); drawMarkers();
      if (selectedStopId !== null) focusStop(false);
      ga('guide_map_ready', { guide: G.id });
    } catch (e) { mbReady = false; mbMap = null; m.innerHTML = keep; drawMap(); }
  }
  function drawMarkers() {
    if (!mbMap) return;
    mbMarkers.forEach(function (x) { x.remove(); }); mbMarkers = [];
    G.stops.forEach(function (s) {
      if (!s.coords) return;
      var on = has(s), el = document.createElement('button');
      el.type = 'button'; el.className = 'mwg-mk' + (on ? ' on' : '') + (s.n === selectedStopId ? ' sel' : '');
      el.setAttribute('aria-label', s.n + '. ' + L(s.name)); el.textContent = on ? '✓' : s.n;
      el.addEventListener('click', function (e) { e.stopPropagation(); ga('guide_pin_select', { guide: G.id, stop: s.id, n: s.n, map: 'mapbox' }); openStop(s.n, 'pin'); });
      mbMarkers.push(new mapboxgl.Marker({ element: el }).setLngLat(s.coords).addTo(mbMap));
    });
  }
  function focusStop(anim) {
    var s = G.stops[selectedStopId - 1]; if (!mbMap || !s || !s.coords) return;
    mbMap.easeTo({ center: s.coords, zoom: Math.max(mbMap.getZoom(), 13), padding: padding(), duration: anim ? 600 : 0 });
  }
  function resizeMap() { if (mbMap) { mbMap.resize(); setTimeout(function () { mbMap.resize(); if (selectedStopId !== null) focusStop(true); }, 280); } }

  /* ---------- list: simple rows like /maps (number box, name, area and time) ---------- */
  function meta(s) { return [L(s.hood), L(s.time)].filter(Boolean).join(' · '); }
  function dirUrl(s) { return s.coords ? 'https://www.google.com/maps/dir/?api=1&destination=' + s.coords[1] + ',' + s.coords[0] : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(L(s.name) + ' Los Angeles'); }
  function drawList() {
    var pg = prog(G), box = document.getElementById('mwg-list');
    var h = '<div class="mwg-lf" role="group" aria-label="' + esc(T.lfL) + '">' + [['all', T.lfAll, pg.t], ['left', T.lfLeft, pg.t - pg.d], ['done', T.lfDone, pg.d]].map(function (x) {
      return '<button type="button" data-lf="' + x[0] + '" aria-pressed="' + (listFilter === x[0]) + '">' + esc(x[1]) + ' <b>' + x[2] + '</b></button>'; }).join('') + '</div>';
    var rows = G.stops.filter(function (s) { return listFilter === 'all' || (listFilter === 'done') === has(s); });
    h += rows.length ? '<ol class="mwg-rows5">' + rows.map(function (s) {
      var on = has(s);
      return '<li><button type="button" class="mwg-r5' + (on ? ' on' : '') + '" id="stop-' + s.n + '" data-stop="' + s.n + '"><span class="n" aria-hidden="true">' + (on ? '✓' : s.n) + '</span>' +
        '<span class="tx"><b>' + esc(L(s.name)) + '</b><small>' + esc([L(s.cat), L(s.hood)].filter(Boolean).join(' · ')) + '</small></span>' + (on ? '<span class="vis">' + esc(T.lfDoneOne) + '</span>' : '') + '</button></li>';
    }).join('') + '</ol>' : '<p class="mwg-lf-empty">' + esc(listFilter === 'done' ? T.lfNone : T.lfAllDone) + '</p>';
    box.innerHTML = h;
    box.querySelectorAll('[data-stop]').forEach(function (b) { b.addEventListener('click', function () { openStop(+b.getAttribute('data-stop'), 'list'); }); });
    box.querySelectorAll('[data-lf]').forEach(function (b) { b.addEventListener('click', function () { listFilter = b.getAttribute('data-lf'); ga('guide_list_filter', { guide: G.id, filter: listFilter }); drawList(); var f = box.querySelector('[data-lf="' + listFilter + '"]'); if (f) f.focus(); }); });
  }
  function drawProgress() { var p = prog(G), e = document.getElementById('mwg-gc'); if (e) e.innerHTML = '<b>' + p.d + '</b>/' + p.t + ' <span aria-hidden="true">✓</span><span class="sr">' + esc(T.of(p.d, p.t)) + '</span>'; }

  /* ---------- the stop card (selectedStopId: null = map + list, a number = map + that stop) ---------- */
  function openStop(n, source, fromHistory) {
    var s = G.stops[n - 1]; if (!s) return;
    var was = selectedStopId; selectedStopId = n;
    if (!fromHistory) {
      if (histPushed) history.replaceState({ mwgStop: n }, '', '?stop=' + n);
      else { history.pushState({ mwgStop: n }, '', '?stop=' + n); histPushed = true; }
    } else histPushed = true;
    var env = document.getElementById('mwg-env');
    env.classList.add('has-card');
    document.getElementById('mwg-list').hidden = true;
    renderCard();
    document.getElementById('mwg-card').hidden = false;
    drawMap(); markSel(); resizeMap(); focusStop(true);
    var r = env.getBoundingClientRect();
    if (source !== 'arrow' && (r.top < 50 || r.top > 90)) window.scrollTo({ top: window.scrollY + r.top - 70, behavior: source === 'link' ? 'auto' : 'smooth' });
    if (was === null || source !== 'arrow') ga('guide_stop_sheet_open', { guide: G.id, stop: s.id, n: n, source: source });
  }
  function closeStop(how) {
    if (selectedStopId === null) return;
    if (histPushed && history.state && history.state.mwgStop) { history.replaceState(null, '', location.pathname + location.hash); histPushed = false; }
    hideCard(how);
  }
  function hideCard(how) {
    var s = G.stops[selectedStopId - 1], n = selectedStopId;
    ga('guide_stop_sheet_close', { guide: G.id, stop: s ? s.id : '', how: how });
    selectedStopId = null; histPushed = false; expanded = false;
    var env = document.getElementById('mwg-env'); env.classList.remove('has-card', 'is-exp');
    document.getElementById('mwg-card').hidden = true;
    document.getElementById('mwg-list').hidden = false;
    drawMap(); markSel(); resizeMap(); setTimeout(function () { fitAll(true); }, 300);
    var row = document.getElementById('stop-' + n); if (row && how !== 'back') row.focus({ preventScroll: true });
  }
  function markSel() {
    document.querySelectorAll('#mwg-map .mwg-pin').forEach(function (p) { p.classList.toggle('sel', +p.getAttribute('data-n') === selectedStopId); });
    if (mbMap) drawMarkers();
  }
  function renderCard() {
    var s = G.stops[selectedStopId - 1], on = has(s), tours = (s.tours || []).filter(function (k) { return TOURS[k]; }), t0 = tours[0] && TOURS[tours[0]], t1 = tours[1] && TOURS[tours[1]];
    var c = '<div class="mwg-c5' + (expanded ? ' exp' : '') + '">' +
      '<button type="button" class="mwg-side" data-step="-1" aria-label="' + esc(T.prev) + '"' + (selectedStopId <= 1 ? ' disabled' : '') + '>‹</button><div class="mwg-c5b">' +
      '<div class="mwg-c5top"><span class="mwg-c5n">' + esc(T.stopOf(s.n, G.stops.length)) + '</span>' + (s.cat ? '<span class="mwg-c5cat">' + esc(L(s.cat)) + '</span>' : '') + '<button type="button" class="mwg-x" data-close aria-label="' + esc(T.close) + '">✕</button></div>' +
      '<div class="mwg-c5hd"><div class="t"><h2 id="mwg-c5h">' + esc(L(s.name)) + '</h2><p class="mwg-meta">📍 ' + esc(meta(s)) + '</p></div>' +
      '<button type="button" class="mwg-stampbtn' + (on ? ' on' : '') + '" aria-pressed="' + on + '" aria-label="' + esc((on ? T.stampOn : T.stampTap) + ': ' + L(s.name)) + '"><span class="sv">' + stampSvg(s, 'mwgc' + s.n) + '</span><small>' + esc(on ? T.stampOn : T.stampTap) + '</small></button></div>' +
      (s.line ? '<p class="mwg-line">' + esc(L(s.line)) + '</p>' : '') +
      '<div class="mwg-c5acts"><a class="mwg-btn alt" data-dir target="_blank" rel="noopener" href="' + dirUrl(s) + '">🚗 ' + esc(T.dir) + '</a><button type="button" class="mwg-btn alt" data-exp aria-expanded="' + expanded + '">' + esc(expanded ? T.less : T.moreS) + '</button></div>' +
      '<div class="mwg-c5more"' + (expanded ? '' : ' hidden') + '>' +
        (s.photo ? '<div class="mwg-sh-ph"><img src="' + esc(s.photo) + '" alt="' + esc((ES ? 'Foto instantánea de ' : 'Instant photo of ') + L(s.name)) + '" loading="lazy"></div>' : '') +
        (s.tip ? '<p class="mwg-tip"><b>' + esc(T.tip) + '</b> ' + esc(L(s.tip)) + '</p>' : '') +
        ((s.icons || []).length ? '<p class="mwg-c5ic">' + s.icons.map(function (k) { var x = P2.key.filter(function (y) { return y[0] === k; })[0]; return '<span>' + (ICONS[k] || '') + ' ' + esc(x ? x[1] : '') + '</span>'; }).join('') + '</p>' : '') +
        (t0 ? '<div class="mwg-tourbox"><p>' + esc(T.tourH) + '</p><a class="mwg-btn" data-tour="' + tours[0] + '" href="' + t0[1] + '">' + esc(t0[0]) + ' →</a>' + (t1 ? '<a class="mwg-link" data-tour="' + tours[1] + '" href="' + t1[1] + '">' + esc(t1[0]) + ' →</a>' : '') + '</div>' : '') +
        '<p class="mwg-sh-dir">' + (s.mapId ? '<a class="mwg-link" href="' + MAP + '?spot=' + encodeURIComponent(s.legacyKey || s.mapId) + '&passport=' + G.id + '">' + esc(T.onLA) + '</a>' : '') + (s.history && L(s.history) ? '<a class="mwg-link" href="' + esc(L(s.history)) + '">' + esc(T.story) + '</a>' : '') + '</p>' +
      '</div>' + (t0 && !expanded ? '<a class="mwg-c5tour" data-tour="' + tours[0] + '" href="' + t0[1] + '">🎟️ ' + esc(t0[0]) + ' →</a>' : '') +
      '</div><button type="button" class="mwg-side" data-step="1" aria-label="' + esc(T.nextS) + '"' + (selectedStopId >= G.stops.length ? ' disabled' : '') + '>›</button></div>';
    var box = document.getElementById('mwg-card'); box.innerHTML = c;
    box.querySelector('[data-close]').addEventListener('click', function () { closeStop('x'); });
    box.querySelectorAll('[data-step]').forEach(function (b) { b.addEventListener('click', function () { var n = selectedStopId + +b.getAttribute('data-step'); if (G.stops[n - 1]) openStop(n, 'arrow'); }); });
    box.querySelector('.mwg-stampbtn').addEventListener('click', function () { toggle(s.n); });
    box.querySelector('[data-exp]').addEventListener('click', function () {
      expanded = !expanded; document.getElementById('mwg-env').classList.toggle('is-exp', expanded);
      ga('guide_card_expand', { guide: G.id, stop: s.id, open: expanded ? 1 : 0 }); renderCard(); resizeMap();
    });
    box.querySelector('[data-dir]').addEventListener('click', function () { ga('guide_directions_click', { guide: G.id, stop: s.id }); });
    box.querySelectorAll('[data-tour]').forEach(function (a) { a.addEventListener('click', function () { ga('guide_tour_cta_click', { guide: G.id, stop: s.id, tour: a.getAttribute('data-tour') }); }); });
  }
  function renderSheet() { if (selectedStopId !== null) renderCard(); }
  function toggle(n) {
    var s = G.stops[n - 1]; if (!s) return;
    var on = !has(s); set(s, on);
    var ev = { guide: G.id, stop: s.id, on: on ? 1 : 0 };
    ga('guide_stamp_toggle', ev); ga('guide_stamp', ev);
    drawList(); drawMap(); drawProgress(); drawPostcard();
    if (selectedStopId === n) {
      renderCard();
      var b = document.querySelector('#mwg-card .mwg-stampbtn'); if (b) b.focus();
      if (on && window.MWStamp && b) { var sv = b.querySelector('.sv'); try { MWStamp.press(sv); MWStamp.burst(sv, [G.ink, '#FFD43B', '#27302E']); } catch (e) {} }
    }
  }

  /* ---------- postcard ---------- */
  function drawPostcard() {
    var got = G.stops.filter(has), box = document.getElementById('mwg-pst');
    if (!box) return;
    box.innerHTML = got.length ? got.slice(-6).map(function (s) { return stampSvg(s, 'mwgp' + s.n); }).join('') : '<p>' + esc(T.noSt) + '</p>';
  }
  function cardText() {
    var p = prog(G), msg = document.getElementById('mwg-msg').value.trim(), to = document.getElementById('mwg-to').value.trim(), fr = document.getElementById('mwg-from').value.trim();
    return { p: p, msg: msg, to: to, fr: fr, text: (to ? (ES ? 'Para ' : 'To ') + to + ': ' : '') + msg + ' ' + T.shareT(p.d, p.t, L(G.name)) + (fr ? ' ' + (ES ? 'De ' : 'From ') + fr + '.' : '') };
  }
  /* Nov 27, 2026: "Send Postcard" submits the hidden native Webflow form "Guide Postcard" (on the guide template), so the note reaches Marlon. */
  function sendCard() {
    var c = cardText(), f = document.getElementById('mwg-pcform'), btn = document.getElementById('mwg-send'), ok = document.getElementById('mwg-ok'), out = document.getElementById('mwg-sent');
    if (!f) { shareCard(); return; }
    function val(id, v) { var e = document.getElementById(id); if (e) e.value = v; }
    val('mwg-f-from', c.fr); val('mwg-f-to', c.to); val('mwg-f-msg', c.msg);
    val('mwg-f-guide', L(G.name) + ' (' + (ES ? 'ES' : 'EN') + ')');
    val('mwg-f-stamps', c.p.d + '/' + c.p.t + ': ' + G.stops.filter(has).map(function (s) { return L(s.name); }).join(', '));
    btn.disabled = true; btn.textContent = T.sending; out.textContent = '';
    var wrap = f.closest('.w-form'), done = wrap && wrap.querySelector('.w-form-done'), fail = wrap && wrap.querySelector('.w-form-fail'), t0 = Date.now();
    var sub = f.querySelector('[type="submit"]');
    if (sub) sub.click(); else f.requestSubmit ? f.requestSubmit() : f.submit();
    (function wait() {
      var isOk = done && getComputedStyle(done).display !== 'none', isBad = fail && getComputedStyle(fail).display !== 'none';
      if (isOk) {
        ok.textContent = T.sent; ok.classList.add('show'); btn.hidden = true; document.getElementById('mwg-share').hidden = false;
        ga('guide_postcard_submit', { guide: G.id, stamps: c.p.d });
        return;
      }
      if (isBad || Date.now() - t0 > 15000) { btn.disabled = false; btn.textContent = '✉️ ' + T.send2; out.textContent = T.sendFail; return; }
      setTimeout(wait, 250);
    })();
  }
  function shareCard() {
    var c = cardText(), url = location.origin + location.pathname, out = document.getElementById('mwg-sent');
    ga('guide_postcard_share', { guide: G.id, stamps: c.p.d });
    if (navigator.share) { navigator.share({ title: T.greet, text: c.text, url: url }).catch(function () {}); return; }
    var all = c.text + ' ' + url;
    (navigator.clipboard ? navigator.clipboard.writeText(all) : Promise.reject()).then(function () { out.textContent = T.copied; }, function () { out.textContent = all; });
  }

  window.addEventListener('storage', function (e) { if (G && (e.key === 'marlon_visited_spots' || e.key === 'marlon_stamps')) { drawList(); drawMap(); drawProgress(); drawPostcard(); if (selectedStopId !== null) renderSheet(); } });
})();
</script>
