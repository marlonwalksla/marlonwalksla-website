<!-- MARLONWALKSLA - LA GUIDES (Nov 28, 2026, round 1). One section for the /guides hub (ES /guias) and every guide page
     (/guides/<slug>, ES /guias/<slug>). Loaded by the one-line mw.js embed (data-s="guides") on those four Webflow pages.
     Webflow CMS (collections "Guides" and "Guides (ES)") holds each guide page's headline, intro and SEO text in a
     hidden .mwg-src block (data-guide = the guide id); this file moves that real text into the layout.
     Data: guides.json (built by tools/build_guides_json.py) + stamp-icons.json + stamp-lib.js.
     Stamps share the map's browser storage: marlon_visited_spots (places with a pin, both the pin id and the old name)
     and marlon_stamps (no pin). So stamping here marks the place on /maps too, and old stamps show up here.
     Map: an illustrated postcard map drawn from the real coordinates; "Open the real map" swaps in Mapbox. -->

    if (dn && G.stops[dn - 1]) { history.replaceState(null, '', location.pathname); setTimeout(function () { openStop(dn, 'link'); }, 120); }
    else if (location.hash) { var t = document.querySelector(location.hash); if (t) setTimeout(function () { t.scrollIntoView(); }, 50); }
  }

  var mbMap = null, mbMarkers = [];
  function drawMap() {
    if (mbMap) return drawMarkers();
    var m = document.getElementById('mwg-map');
    m.innerHTML = mapSvg(G, 600, 400, { uid: 'g' });
    m.querySelectorAll('.mwg-pin').forEach(function (p) {
      var pn = +p.getAttribute('data-n');
      if (pn === selectedStopId) p.classList.add('sel');
      function go() { ga('guide_pin_select', { guide: G.id, stop: G.stops[pn - 1].id, n: pn, map: 'drawn' }); openStop(pn, 'pin'); }
      p.addEventListener('click', go); p.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    });
  }
  function drawList() {
    var areas = G.areas || [], h = '', ai = 0, parts = [];
    G.stops.forEach(function (s, i) {
      if (areas[ai] && areas[ai].from === s.n) { if (parts.length) h += '<ol class="mwg-rows">' + parts.join('') + '</ol>'; parts = []; h += '<h2 class="mwg-area">' + esc(L(areas[ai])) + '</h2>'; ai++; }
      parts.push(rowHtml(s));
    });
    h += '<ol class="mwg-rows">' + parts.join('') + '</ol>';
    var box = document.getElementById('mwg-list');
    box.className = 'mwg-pc'; box.style.setProperty('--pc', '#FFFDF8'); box.style.setProperty('--edge1', '#2E9E57');
    box.innerHTML = h + '<div id="mwg-p2"></div>';
    box.querySelectorAll('[data-stop]').forEach(function (b) { b.addEventListener('click', function () { openStop(+b.getAttribute('data-stop'), 'list'); }); });
  }
  function meta(s) { return [L(s.hood), L(s.time), L(s.cat)].filter(Boolean).join(' · '); }
  function dirUrl(s) { return s.coords ? 'https://www.google.com/maps/dir/?api=1&destination=' + s.coords[1] + ',' + s.coords[0] : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(L(s.name) + ' Los Angeles'); }
  function rowHtml(s) {
    var on = has(s);
    return '<li><button type="button" class="mwg-rowb' + (on ? ' on' : '') + (s.n === selectedStopId ? ' sel' : '') + '" id="stop-' + s.n + '" data-stop="' + s.n + '" aria-haspopup="dialog">' +
      '<span class="n" aria-hidden="true">' + (on ? '✓' : s.n) + '</span>' +
      '<span class="th" aria-hidden="true">' + (s.photo ? '<img src="' + esc(s.photo) + '" alt="" loading="lazy" decoding="async">' : stampSvg(s, 'mwgr' + s.n)) + '</span>' +
      '<span class="tx"><b>' + esc(L(s.name)) + '</b><small>' + esc([L(s.hood), L(s.time)].filter(Boolean).join(' · ')) + (on ? ' · ' + esc(T.stamped) : '') + '</small></span><span class="ch" aria-hidden="true">›</span></button></li>';
  }

  /* ---------- the "what to do here" panel. selectedStopId: null = overview, a number = that stop is open ---------- */
  var selectedStopId = null, sheet = null, shBody = null, histPushed = false, closeHow = '';
  function buildSheet() {
    if (sheet) return;
    sheet = document.createElement('div');
    sheet.className = 'mwg-sheet'; sheet.setAttribute('role', 'dialog'); sheet.setAttribute('aria-modal', 'false'); sheet.setAttribute('aria-labelledby', 'mwg-sh-h');
    sheet.style.setProperty('--ink', G.ink);
    sheet.innerHTML = '<div class="mwg-sh-top"><span class="mwg-sh-grab" aria-hidden="true"></span><button type="button" class="mwg-ib" data-a="prev" aria-label="' + esc(T.prev) + '">‹</button><button type="button" class="mwg-ib" data-a="next" aria-label="' + esc(T.nextS) + '">›</button><span class="pg" id="mwg-sh-pg"></span><button type="button" class="mwg-ib" data-a="x" aria-label="' + esc(T.close) + '">✕</button></div><div class="mwg-sh-body" id="mwg-sh-b"></div>';
    document.body.appendChild(sheet);
    shBody = sheet.querySelector('#mwg-sh-b');
    sheet.querySelector('[data-a="x"]').addEventListener('click', function () { closeStop('x'); });
    sheet.querySelector('[data-a="prev"]').addEventListener('click', function () { if (selectedStopId > 1) openStop(selectedStopId - 1, 'arrow'); });
    sheet.querySelector('[data-a="next"]').addEventListener('click', function () { if (selectedStopId < G.stops.length) openStop(selectedStopId + 1, 'arrow'); });
    /* tap outside the panel closes it, but a tap on another pin or stop switches to that stop */
    document.addEventListener('click', function (e) {
      if (selectedStopId === null || sheet.contains(e.target)) return;
      if (e.target.closest && e.target.closest('.mwg-pin, .mwg-mbpin, [data-stop]')) return;
      closeStop('outside');
    }, true);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && selectedStopId !== null) closeStop('esc'); });
    window.addEventListener('popstate', function () {
      var st = history.state && history.state.mwgStop;
      if (st) { openStop(st, 'back', true); return; }
      if (selectedStopId !== null) { histPushed = false; hideSheet(closeHow || 'back'); }
      closeHow = '';
    });
    /* swipe down to close: from the top bar, or from the body when it is scrolled to the top */
    var y0 = null, dy = 0;
    sheet.addEventListener('touchstart', function (e) {
      var fromTop = e.target.closest('.mwg-sh-top') && !e.target.closest('button');
      if (!fromTop && shBody.scrollTop > 0) { y0 = null; return; }
      y0 = e.touches[0].clientY; dy = 0;
    }, { passive: true });
    sheet.addEventListener('touchmove', function (e) {
      if (y0 === null) return;
      dy = e.touches[0].clientY - y0;
      if (dy > 0) { sheet.classList.add('drag'); sheet.style.transform = 'translate(-50%,' + dy + 'px)'; }
    }, { passive: true });
    sheet.addEventListener('touchend', function () {
      if (y0 === null) return;
      sheet.classList.remove('drag'); sheet.style.transform = '';
      if (dy > 90) closeStop('swipe');
      y0 = null; dy = 0;
    });
  }
  function openStop(n, source, fromHistory) {
    var s = G.stops[n - 1]; if (!s) return;
    var was = selectedStopId;
    selectedStopId = n;
    renderSheet();
    if (!fromHistory) {
      if (histPushed) history.replaceState({ mwgStop: n }, '', '?stop=' + n);
      else { history.pushState({ mwgStop: n }, '', '?stop=' + n); histPushed = true; }
    } else histPushed = true;
    sheet.classList.add('open');
    markSel();
    /* coming from the list: bring the map back into view above the panel (no jump when tapping a pin) */
    if (source === 'list' || source === 'link') {
      var mp = document.getElementById('mwg-map'), r = mp.getBoundingClientRect();
      if (r.top < 60 || r.bottom > window.innerHeight * 0.42) window.scrollTo({ top: window.scrollY + r.top - 76, behavior: source === 'link' ? 'auto' : 'smooth' });
    }
    if (was === null || source !== 'arrow') ga('guide_stop_sheet_open', { guide: G.id, stop: s.id, n: n, source: source });
  }
  function closeStop(how) {
    if (selectedStopId === null) return;
    if (histPushed && history.state && history.state.mwgStop) { closeHow = how; history.back(); return; }
    hideSheet(how);
  }
  function hideSheet(how) {
    var s = G.stops[selectedStopId - 1];
    ga('guide_stop_sheet_close', { guide: G.id, stop: s ? s.id : '', how: how });
    selectedStopId = null; histPushed = false;
    sheet.classList.remove('open');
    markSel();
  }
  function markSel() {
    document.querySelectorAll('#mwg-map .mwg-pin').forEach(function (p) { p.classList.toggle('sel', +p.getAttribute('data-n') === selectedStopId); });
    document.querySelectorAll('.mwg-rowb').forEach(function (b) { b.classList.toggle('sel', +b.getAttribute('data-stop') === selectedStopId); });
    if (mbMap) drawMarkers();
  }
  function renderSheet() {
    var s = G.stops[selectedStopId - 1], on = has(s), p = prog(G);
    sheet.querySelector('[data-a="prev"]').disabled = selectedStopId <= 1;
    sheet.querySelector('[data-a="next"]').disabled = selectedStopId >= G.stops.length;
    document.getElementById('mwg-sh-pg').textContent = T.of(p.d, p.t);
    var tours = (s.tours || []).filter(function (k) { return TOURS[k]; });
    var h = '<div class="mwg-sh-ph">' + (s.photo ? '<img src="' + esc(s.photo) + '" alt="' + esc((ES ? 'Foto instantánea de ' : 'Instant photo of ') + L(s.name)) + '">' : stampSvg(s, 'mwgsh' + s.n)) + '</div>';
    h += '<h2 id="mwg-sh-h">' + s.n + '. ' + esc(L(s.name)) + '</h2>';
    if (meta(s)) h += '<p class="mwg-meta">' + esc(meta(s)) + '</p>';
    if (s.line) h += '<p class="mwg-line">' + esc(L(s.line)) + '</p>';
    if (s.tip) h += '<p class="mwg-tip"><b>' + esc(T.tip) + '</b> ' + esc(L(s.tip)) + '</p>';
    h += '<div class="mwg-sh-acts"><button type="button" class="mwg-btn mwg-stamp" aria-pressed="' + on + '">' + (on ? '✓ ' + esc(T.stamped) : esc(T.stampIt)) + '</button>' +
      '<a class="mwg-btn alt" data-dir target="_blank" rel="noopener" href="' + dirUrl(s) + '">' + esc(T.dir) + ' ↗</a></div>';
    if (tours.length) {
      var t0 = TOURS[tours[0]], t1 = tours[1] && TOURS[tours[1]];
      h += '<div class="mwg-tourbox"><p>' + esc(T.tourH) + '</p><a class="mwg-btn" data-tour="' + tours[0] + '" href="' + t0[1] + '">' + esc(t0[0]) + ' →</a>' +
        (t1 ? '<a class="mwg-link" data-tour="' + tours[1] + '" href="' + t1[1] + '">' + esc(t1[0]) + ' →</a>' : '') + '</div>';
    }
    h += '<div class="mwg-sh-links">' + (s.mapId ? '<a class="mwg-link" href="' + MAP + '?spot=' + encodeURIComponent(s.legacyKey || s.mapId) + '&passport=' + G.id + '">' + esc(T.onLA) + '</a>' : '') +
      (s.history && L(s.history) ? '<a class="mwg-link" href="' + esc(L(s.history)) + '">' + esc(T.story) + '</a>' : '') + '</div>';
    shBody.innerHTML = h; shBody.scrollTop = 0;
    shBody.querySelector('.mwg-stamp').addEventListener('click', function () { toggle(s.n); });
    shBody.querySelector('[data-dir]').addEventListener('click', function () { ga('guide_directions_click', { guide: G.id, stop: s.id }); });
    shBody.querySelectorAll('[data-tour]').forEach(function (a) { a.addEventListener('click', function () { ga('guide_tour_cta_click', { guide: G.id, stop: s.id, tour: a.getAttribute('data-tour') }); }); });
  }
  function drawProgress() {
    var p = prog(G), h = bar(p) + (p.t && p.d === p.t ? '<p class="mwg-done">' + esc(T.done) + '</p>' : '');
    ['mwg-p1', 'mwg-p2'].forEach(function (id) { var e = document.getElementById(id); if (e) e.innerHTML = h; });
  }
  function toggle(n) {
    var s = G.stops[n - 1]; if (!s) return;
    var on = !has(s); set(s, on);
    var ev = { guide: G.id, stop: s.id, on: on ? 1 : 0 };
    ga('guide_stamp_toggle', ev); ga('guide_stamp', ev);   /* old name kept for a while so GA history lines up */
    drawList(); drawMap(); drawProgress(); drawPostcard();
    if (selectedStopId === n) {
      renderSheet();
      var b = shBody.querySelector('.mwg-stamp'); if (b) b.focus();
      if (on && window.MWStamp) { var sv = shBody.querySelector('.mwg-sh-ph'); try { MWStamp.burst(sv, [G.ink, '#FFD43B', '#27302E']); } catch (e) {} }
    }
  }

  /* ---------- the real map (Mapbox), on tap ---------- */
  function loadMapbox() {
    if (window.mapboxgl) return Promise.resolve();
    return new Promise(function (res, rej) {
      var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css'; document.head.appendChild(l);
      var s = document.createElement('script'); s.src = 'https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s);
    });
  }
  function openReal() {
    var btn = document.getElementById('mwg-real'), m = document.getElementById('mwg-map');
    if (mbMap) return;
    btn.disabled = true; btn.textContent = T.loadMap; ga('guide_map_open', { guide: G.id });
    loadMapbox().then(function () {
      m.innerHTML = '<div class="mwg-mb" id="mwg-mb"></div>';
      mapboxgl.accessToken = TOKEN;
      var phone = window.matchMedia('(max-width: 899px)').matches;
      mbMap = new mapboxgl.Map({ container: 'mwg-mb', style: 'mapbox://styles/mapbox/streets-v12', center: [-118.35, 34.05], zoom: 10, cooperativeGestures: phone });
      mbMap.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'top-right');
      mbMap.addControl(new mapboxgl.GeolocateControl({ positionOptions: { enableHighAccuracy: true }, trackUserLocation: true }), 'top-right');
      var b = new mapboxgl.LngLatBounds(); G.stops.forEach(function (s) { if (s.coords) b.extend(s.coords); });
      mbMap.fitBounds(b, { padding: 50, duration: 0 });
      drawMarkers();
      btn.style.display = 'none';
    }).catch(function () { btn.disabled = false; btn.textContent = T.fail; });
  }
  function drawMarkers() {
    mbMarkers.forEach(function (x) { x.remove(); }); mbMarkers = [];
    G.stops.forEach(function (s) {
      if (!s.coords) return;
      var on = has(s), el = document.createElement('button');
      el.type = 'button'; el.setAttribute('aria-label', s.n + '. ' + L(s.name));
      el.style.cssText = 'width:30px;height:30px;border-radius:50%;border:3px solid ' + G.ink + ';background:' + (on ? G.ink : '#fff') + ';color:' + (on ? '#fff' : G.ink) + ';font:16px "Lilita One",sans-serif;cursor:pointer;box-shadow:2px 2px 0 #27302E;padding:0';
      el.textContent = on ? '✓' : s.n;
      el.className = 'mwg-mbpin'; el.addEventListener('click', function () { ga('guide_pin_select', { guide: G.id, stop: s.id, n: s.n, map: 'mapbox' }); openStop(s.n, 'pin'); });
      if (s.n === selectedStopId) el.style.background = '#FFD43B', el.style.color = '#27302E';
      mbMarkers.push(new mapboxgl.Marker({ element: el }).setLngLat(s.coords).addTo(mbMap));
    });
  }

  /* ---------- postcard ---------- */
  function drawPostcard() {
    var got = G.stops.filter(has), box = document.getElementById('mwg-pst');
    if (!box) return;
    box.innerHTML = got.length ? got.slice(-6).map(function (s) { return stampSvg(s, 'mwgp' + s.n); }).join('') : '<p>' + esc(T.noSt) + '</p>';
  }
  function cardText() {
    var p = prog(G), msg = document.getElementById('mwg-msg').value.trim(), to = document.getElementById('mwg-to').value.trim(), fr = document.getElementById('mwg-from').value.trim();
    return { p: p, msg: msg, to: to, fr: fr, text: (to ? (ES ? 'Para ' : 'To ') + to + ': ' : '') + msg + ' ' + T.shareT(p.d, p.t, L(G.name)) + (fr ? ' ' + (ES ? 'De ' : 'From ') + fr + '.' : '') };
  }
  /* Nov 27, 2026: "Send Postcard" submits the hidden native Webflow form "Guide Postcard" (on the guide template), so the note reaches Marlon. */
  function sendCard() {
    var c = cardText(), f = document.getElementById('mwg-pcform'), btn = document.getElementById('mwg-send'), ok = document.getElementById('mwg-ok'), out = document.getElementById('mwg-sent');
    if (!f) { shareCard(); return; }
    function val(id, v) { var e = document.getElementById(id); if (e) e.value = v; }
    val('mwg-f-from', c.fr); val('mwg-f-to', c.to); val('mwg-f-msg', c.msg);
    val('mwg-f-guide', L(G.name) + ' (' + (ES ? 'ES' : 'EN') + ')');
    val('mwg-f-stamps', c.p.d + '/' + c.p.t + ': ' + G.stops.filter(has).map(function (s) { return L(s.name); }).join(', '));
    btn.disabled = true; btn.textContent = T.sending; out.textContent = '';
    var wrap = f.closest('.w-form'), done = wrap && wrap.querySelector('.w-form-done'), fail = wrap && wrap.querySelector('.w-form-fail'), t0 = Date.now();
    var sub = f.querySelector('[type="submit"]');
    if (sub) sub.click(); else f.requestSubmit ? f.requestSubmit() : f.submit();
    (function wait() {
      var isOk = done && getComputedStyle(done).display !== 'none', isBad = fail && getComputedStyle(fail).display !== 'none';
      if (isOk) {
        ok.textContent = T.sent; ok.classList.add('show'); btn.hidden = true; document.getElementById('mwg-share').hidden = false;
        ga('guide_postcard_submit', { guide: G.id, stamps: c.p.d });
        return;
      }
      if (isBad || Date.now() - t0 > 15000) { btn.disabled = false; btn.textContent = '✉️ ' + T.send2; out.textContent = T.sendFail; return; }
      setTimeout(wait, 250);
    })();
  }
  function shareCard() {
    var c = cardText(), url = location.origin + location.pathname, out = document.getElementById('mwg-sent');
    ga('guide_postcard_share', { guide: G.id, stamps: c.p.d });
    if (navigator.share) { navigator.share({ title: T.greet, text: c.text, url: url }).catch(function () {}); return; }
    var all = c.text + ' ' + url;
    (navigator.clipboard ? navigator.clipboard.writeText(all) : Promise.reject()).then(function () { out.textContent = T.copied; }, function () { out.textContent = all; });
  }

  window.addEventListener('storage', function (e) { if (G && (e.key === 'marlon_visited_spots' || e.key === 'marlon_stamps')) { drawList(); drawMap(); drawProgress(); drawPostcard(); if (selectedStopId !== null) renderSheet(); } });
})();
</script>
