    [[-118.50, 34.07], [-118.44, 34.075], [-118.40, 34.082], [-118.36, 34.09], [-118.32, 34.098], [-118.28, 34.09], [-118.25, 34.075]]
  ];
  var LABELS = [[-118.62, 33.98, 'Pacific Ocean', 'Océano Pacífico', 1], [-118.49, 34.022, 'Santa Monica', 'Santa Mónica'], [-118.465, 33.99, 'Venice', 'Venice'],
    [-118.40, 34.07, 'Beverly Hills', 'Beverly Hills'], [-118.33, 34.093, 'Hollywood', 'Hollywood'], [-118.245, 34.045, 'Downtown LA', 'Centro de LA']];

  function mapSvg(g, W, H, opt) {

    var xs = pts.map(function (s) { return s.coords[0] * kx; }), ys = pts.map(function (s) { return s.coords[1]; });
    var x0 = Math.min.apply(0, xs), x1 = Math.max.apply(0, xs), y0 = Math.min.apply(0, ys), y1 = Math.max.apply(0, ys);

    var ocean = path([[-119.5, 34.5]].concat(COAST).concat([[-119.5, 33.5]]), true);
    var beach = path(COAST, false);
    var o = '<svg class="mwg-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(T.mapAlt) + '" xmlns="http://www.w3.org/2000/svg">';
    o += '<defs><pattern id="mwgGrid' + (opt.uid || '') + '" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#EDE5D3" stroke-width="1.2"/></pattern></defs>';
    o += '<rect width="' + W + '" height="' + H + '" fill="#FFFDF8"/><rect width="' + W + '" height="' + H + '" fill="url(#mwgGrid' + (opt.uid || '') + ')"/>';
    o += '<path d="' + path(HILLS, true) + '" fill="#D6EDC6"/>';
    o += '<path d="' + ocean + '" fill="#BFE3F2"/><path d="' + beach + '" fill="none" stroke="#F6E3B5" stroke-width="9" stroke-linejoin="round"/><path d="' + beach + '" fill="none" stroke="#8ECFEA" stroke-width="2.5"/>';
    ROADS.forEach(function (r) { o += '<path d="' + path(r) + '" fill="none" stroke="#F4B942" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>'; });
    /* pins: push apart the ones that overlap (Downtown and Hollywood stops sit close together) */
    var R = opt.r || 14, nodes = pts.map(function (s) { var p = P(s.coords); return { s: s, x: p[0], y: p[1], ox: p[0], oy: p[1] }; });
    for (var it = 0; it < 120; it++) {
      for (var i = 0; i < nodes.length; i++) for (var j = i + 1; j < nodes.length; j++) {
        var a = nodes[i], b = nodes[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 0.01, min = R * 2 + 3;

      if (p[0] - hw < 4 || p[0] + hw > W - 4 || p[1] < 14 || p[1] > H - 8) return;
      if (nodes.some(function (n) { return Math.abs(n.x - p[0]) < hw + R && n.y > p[1] - 12 - R && n.y < p[1] + 4 + R; })) return;
      o += '<text x="' + p[0].toFixed(0) + '" y="' + p[1].toFixed(0) + '" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="' + (l[4] ? 13 : 14) + '" fill="' + (l[4] ? '#2C7FA3' : '#5B6663') + '" stroke="#FFFDF8" stroke-width="4" paint-order="stroke">' + esc(txt) + '</text>'; });
    nodes.forEach(function (n) { if (Math.abs(n.x - n.ox) + Math.abs(n.y - n.oy) > 4) o += '<line x1="' + n.ox.toFixed(1) + '" y1="' + n.oy.toFixed(1) + '" x2="' + n.x.toFixed(1) + '" y2="' + n.y.toFixed(1) + '" stroke="#27302E" stroke-width="1.5" opacity=".5"/><circle cx="' + n.ox.toFixed(1) + '" cy="' + n.oy.toFixed(1) + '" r="2.5" fill="#27302E"/>'; });
    nodes.forEach(function (n) {
      var on = has(n.s), ink = g.ink;
      o += '<g class="mwg-pin" data-n="' + n.s.n + '" tabindex="' + (opt.static ? -1 : 0) + '" role="link" aria-label="' + esc(n.s.n + '. ' + L(n.s.name)) + '"><circle class="pc" cx="' + n.x.toFixed(1) + '" cy="' + n.y.toFixed(1) + '" r="' + R + '" fill="' + (on ? ink : '#fff') + '" stroke="' + ink + '" stroke-width="3"/>' +
        '<text x="' + n.x.toFixed(1) + '" y="' + (n.y + R * 0.38).toFixed(1) + '" text-anchor="middle" font-family="Lilita One, sans-serif" font-size="' + Math.round(R * 1.05) + '" fill="' + (on ? '#fff' : ink) + '">' + (on ? '✓' : n.s.n) + '</text></g>';
    });
    return o + '</svg>';
  }

  /* ---------- loading ---------- */
  function getJSON(u) { return fetch(u).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }
  function loadLib() {
    return new Promise(function (res, rej) {

      var sc = document.createElement('script'); sc.src = MAIN + 'stamp-lib.js'; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc);
    }).then(function () { return MWStamp.load(MAIN); });
  }
  var D = null;
  Promise.all([getJSON(DATA), loadLib()]).then(function (r) {
    D = r[0];
    if (view === 'hub') renderHub(); else renderGuide();
  }).catch(function (e) { console.error('[guides]', e); root.innerHTML = '<p class="mwg-load">' + esc(T.fail) + '</p>'; });

  /* ---------- hub ---------- */
  function renderHub() {
    var gs = D.guides, f = gs[0], rest = gs.slice(1), h = '<div class="mwg-wrap">';

      '<img class="mwg-ern" src="' + ERN + '" alt="' + (ES ? 'Ernesto, el burrito de piñata' : 'Ernesto the piñata donkey') + '" width="541" height="800" loading="lazy"></div></section>';
    h += '<section class="mwg-pc" style="--pc:#E0F1F8;--ink:' + f.ink + '"><div class="mwg-feat"><div><p class="mwg-kick">' + esc(T.start) + ' · ' + esc(L(f.name)) + '</p><h2 class="mwg-h1">' + esc(T.featT) + '</h2>' +
      '<p class="mwg-body">' + esc(L(f.tagline)) + '</p>' + bar(prog(f)) + '<div class="mwg-row"><a class="mwg-btn" data-g="' + f.id + '" href="' + pageUrl(f) + '">' + esc(T.open) + '</a></div></div>' +
      '<a class="mwg-featmap" data-g="' + f.id + '" href="' + pageUrl(f) + '" tabindex="-1" aria-hidden="true">' + mapSvg(f, 600, 380, { uid: 'f', static: 1, r: 12 }) + '</a></div></section>';
    h += '<section class="mwg-pc" style="--pc:#FFFDF8;--edge1:#E8742A;--edge2:#2890B6"><h2 class="mwg-h2">' + esc(T.more) + '</h2><div class="mwg-grid">';
    var BG = ['#FFE6EF', '#E8F6DF', '#FFE9D9', '#F0E8F8', '#FFF6D6', '#E0F1F8'];
    rest.forEach(function (g, i) {
      var p = prog(g);
      h += '<a class="mwg-card" data-g="' + g.id + '" href="' + pageUrl(g) + '" style="--bg:' + BG[i % BG.length] + ';--ink:' + g.ink + '"><span class="art" aria-hidden="true">' + guideStamp(g, 'mwgh' + i) + '</span>' +
        '<span class="nm">' + esc(L(g.name)) + '</span><span class="tg">' + esc(L(g.tagline)) + '</span>' +
        '<span class="ft"><span>' + esc(T.of(p.d, p.t)) + '</span>' + (g.page ? '' : '<small>' + esc(T.onMap) + '</small>') + '</span></a>';

    h += '</div></section>';
    h += '<section class="mwg-pc mwg-foot" style="--pc:#FFF6D6"><h2 class="mwg-h2">' + esc(T.allT) + '</h2><p class="mwg-body">' + esc(T.allP) + '</p><div class="mwg-row" style="justify-content:center"><a class="mwg-btn alt" href="' + MAP + '?from=guides">' + esc(T.allB) + '</a></div></section>';

  }

  /* ---------- guide page ---------- */
  var G = null;
  function renderGuide() {
    var gid = src && src.getAttribute('data-guide');
    G = D.guides.filter(function (g) { return g.id === gid || L(g.slug) === slug; })[0];
    if (!G) { root.innerHTML = '<div class="mwg-wrap"><p class="mwg-load">' + esc(T.nf) + ' <a href="' + HUB + '">' + esc(T.back) + '</a></p></div>'; return; }
    root.style.setProperty('--ink', G.ink);
    /* hreflang pair, for search engines */
    [['en', '/guides/' + G.slug.en], ['es', '/guias/' + G.slug.es], ['x-default', '/guides/' + G.slug.en]].forEach(function (x) {
      var l = document.createElement('link'); l.rel = 'alternate'; l.hreflang = x[0]; l.href = 'https://www.marlonwalksla.com' + x[1]; document.head.appendChild(l);
    });
    /* header EN | ES: this guide's twin page (data-mw-pair tells the header and footer scripts to leave these alone) */
    var hen = document.getElementById('mwhd-en'), hes = document.getElementById('mwhd-es');
    if (hen && hes) { hen.href = '/guides/' + G.slug.en; hes.href = '/guias/' + G.slug.es; hen.setAttribute('data-mw-pair', '1'); hes.setAttribute('data-mw-pair', '1'); hen.setAttribute('aria-current', ES ? 'false' : 'true'); hes.setAttribute('aria-current', ES ? 'true' : 'false'); }
    var i0 = D.guides.indexOf(G), nx = D.guides[(i0 + 1) % D.guides.length];
    var h = '<div class="mwg-wrap"><a class="mwg-back" href="' + HUB + '">' + esc(T.back) + '</a>';
    h += '<section class="mwg-pc" id="mwg-top"><p class="mwg-kick">' + esc(T.guide) + ' · ' + esc(L(G.name)) + ' · ' + esc(T.stops(G.stops.length)) + '</p><div id="mwg-h"></div><div class="mwg-intro" id="mwg-i"></div><p class="mwg-by">' + esc(T.by) + '</p><div id="mwg-p1"></div></section>';
    h += '<section class="mwg-pc" style="--pc:#E0F1F8"><h2 class="mwg-h2">' + esc(T.mapH) + '</h2><div class="mwg-map" id="mwg-map"></div><div class="mwg-maptools"><button type="button" class="mwg-btn alt" id="mwg-real">🗺️ ' + esc(T.openMap) + '</button><a class="mwg-link" href="' + MAP + '?passport=' + G.id + '&from=guides">' + esc(T.laMap) + '</a><p class="mwg-hint">' + esc(T.hint) + '</p></div></section>';
    h += '<section id="mwg-list"></section>';
    h += '<section class="mwg-pc" id="mwg-pc" style="--pc:#FFE6EF;--edge1:#D6457A;--edge2:#2890B6"><h2 class="mwg-h2">' + esc(T.pcH) + '</h2><p class="mwg-body">' + esc(T.pcP) + '</p>' +
      '<div class="mwg-card2"><div class="l"><div class="gr">' + esc(T.greet) + '</div><textarea id="mwg-msg" aria-label="' + esc(T.pcH) + '">' + esc(T.msg) + '</textarea></div>' +
      '<div class="r"><div class="stamps" id="mwg-pst"></div><label>' + esc(T.to) + ' <input id="mwg-to" autocomplete="off"></label><label>' + esc(T.from) + ' <input id="mwg-from" autocomplete="given-name"></label></div></div>' +
      '<div class="mwg-row"><button type="button" class="mwg-btn" id="mwg-send">✉️ ' + esc(T.send) + '</button><a class="mwg-link" href="' + pageUrl(nx) + '">' + esc(T.next) + ': ' + esc(L(nx.name)) + ' →</a></div><p class="mwg-msg" id="mwg-sent" role="status"></p></section>';

  }

  var mbMap = null, mbMarkers = [];
  function drawMap() {
    if (mbMap) return drawMarkers();
    var m = document.getElementById('mwg-map');
    m.innerHTML = mapSvg(G, 600, 400, { uid: 'g' });
    m.querySelectorAll('.mwg-pin').forEach(function (p) {
      function go() { var el = document.getElementById('stop-' + p.getAttribute('data-n')); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      p.addEventListener('click', go); p.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    });
  }
  function drawList() {
    var areas = G.areas || [], h = '', ai = 0;
    var parts = [];
    G.stops.forEach(function (s, i) {
      if (areas[ai] && areas[ai].from === s.n) { if (parts.length) h += '<ol class="mwg-stops">' + parts.join('') + '</ol>'; parts = []; h += '<h2 class="mwg-area">' + esc(L(areas[ai])) + '</h2>'; ai++; }
      parts.push(stopHtml(s, i));
    });
    h += '<ol class="mwg-stops" start="1">' + parts.join('') + '</ol>';
    var box = document.getElementById('mwg-list');
    box.className = 'mwg-pc'; box.style.setProperty('--pc', '#FFFDF8'); box.style.setProperty('--edge1', '#2E9E57');
    box.innerHTML = h + '<div id="mwg-p2"></div>';
    box.querySelectorAll('.mwg-stamp').forEach(function (b) { b.addEventListener('click', function () { toggle(+b.getAttribute('data-n')); }); });
  }
  function stopHtml(s, i) {
    var on = has(s), dir = s.coords ? 'https://www.google.com/maps/dir/?api=1&destination=' + s.coords[1] + ',' + s.coords[0] : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(L(s.name) + ' Los Angeles');
    var h = '<li class="mwg-stop' + (on ? ' on' : '') + '" id="stop-' + s.n + '"><span class="mwg-num" aria-hidden="true">' + (on ? '✓' : s.n) + '</span><div>';
    h += '<h2>' + esc(L(s.name)) + '</h2>' + (s.line ? '<p class="mwg-line">' + esc(L(s.line)) + '</p>' : '');
    if (s.tip) h += '<p class="mwg-tip"><b>' + esc(T.tip) + '</b>' + esc(L(s.tip)) + '</p>';
    h += '<div class="mwg-acts"><button type="button" class="mwg-btn mwg-stamp" data-n="' + s.n + '" aria-pressed="' + on + '">' + (on ? '✓ ' + esc(T.stamped) : esc(T.stampIt)) + '</button>' +
      '<a class="mwg-link" target="_blank" rel="noopener" href="' + dir + '">' + esc(T.dir) + ' ↗</a>' +
      (s.mapId ? '<a class="mwg-link" href="' + MAP + '?spot=' + encodeURIComponent(s.legacyKey || s.mapId) + '&passport=' + G.id + '">' + esc(T.onLA) + '</a>' : '') +
      (s.history && L(s.history) ? '<a class="mwg-link" href="' + esc(L(s.history)) + '">' + esc(T.story) + '</a>' : '') + '</div></div>';
    h += '<div class="mwg-media">' + (s.photo ? '<figure class="mwg-photo" style="--r:' + (i % 2 ? '2deg' : '-2deg') + ';margin:0"><img src="' + esc(s.photo) + '" alt="' + esc((ES ? 'Foto instantánea de ' : 'Instant photo of ') + L(s.name)) + '" loading="lazy" decoding="async"></figure>' : '') +
      '<div class="mwg-st"><span class="s">' + stampSvg(s, 'mwgs' + s.n) + '</span><small>' + esc(on ? T.got : T.honest) + '</small></div></div></li>';
    return h;
  }
  function drawProgress() {
    var p = prog(G), h = bar(p) + (p.t && p.d === p.t ? '<p class="mwg-done">' + esc(T.done) + '</p>' : '');
    ['mwg-p1', 'mwg-p2'].forEach(function (id) { var e = document.getElementById(id); if (e) e.innerHTML = h; });
  }
  function toggle(n) {
    var s = G.stops[n - 1]; if (!s) return;
    var on = !has(s); set(s, on);
    ga('guide_stamp', { guide: G.id, stop: s.id, on: on ? 1 : 0 });
    var li = document.getElementById('stop-' + n), tmp = document.createElement('div');
    tmp.innerHTML = stopHtml(s, n - 1); var nl = tmp.firstChild; li.parentNode.replaceChild(nl, li);
    nl.querySelector('.mwg-stamp').addEventListener('click', function () { toggle(n); });
    nl.querySelector('.mwg-stamp').focus();
    if (on && window.MWStamp) { var sv = nl.querySelector('.mwg-st .s'); try { MWStamp.press(sv); MWStamp.burst(sv, [G.ink, '#FFD43B', '#27302E']); } catch (e) {} }
    drawMap(); drawProgress(); drawPostcard();
  }

  /* ---------- the real map (Mapbox), on tap ---------- */
  function loadMapbox() {
    if (window.mapboxgl) return Promise.resolve();
    return new Promise(function (res, rej) {
      var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css'; document.head.appendChild(l);
      var s = document.createElement('script'); s.src = 'https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s);
    });
  }
  function openReal() {
    var btn = document.getElementById('mwg-real'), m = document.getElementById('mwg-map');
    if (mbMap) return;
    btn.disabled = true; btn.textContent = T.loadMap; ga('guide_map_open', { guide: G.id });
    loadMapbox().then(function () {
      m.innerHTML = '<div class="mwg-mb" id="mwg-mb"></div>';
      mapboxgl.accessToken = TOKEN;
      var phone = window.matchMedia('(max-width: 899px)').matches;
      mbMap = new mapboxgl.Map({ container: 'mwg-mb', style: 'mapbox://styles/mapbox/streets-v12', center: [-118.35, 34.05], zoom: 10, cooperativeGestures: phone });
      mbMap.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'top-right');
      mbMap.addControl(new mapboxgl.GeolocateControl({ positionOptions: { enableHighAccuracy: true }, trackUserLocation: true }), 'top-right');
      var b = new mapboxgl.LngLatBounds(); G.stops.forEach(function (s) { if (s.coords) b.extend(s.coords); });
      mbMap.fitBounds(b, { padding: 50, duration: 0 });
      drawMarkers();
      btn.style.display = 'none';
    }).catch(function () { btn.disabled = false; btn.textContent = T.fail; });
  }
  function drawMarkers() {
    mbMarkers.forEach(function (x) { x.remove(); }); mbMarkers = [];
    G.stops.forEach(function (s) {
      if (!s.coords) return;
      var on = has(s), el = document.createElement('button');
      el.type = 'button'; el.setAttribute('aria-label', s.n + '. ' + L(s.name));
      el.style.cssText = 'width:30px;height:30px;border-radius:50%;border:3px solid ' + G.ink + ';background:' + (on ? G.ink : '#fff') + ';color:' + (on ? '#fff' : G.ink) + ';font:16px "Lilita One",sans-serif;cursor:pointer;box-shadow:2px 2px 0 #27302E;padding:0';
      el.textContent = on ? '✓' : s.n;
      el.addEventListener('click', function () { var t = document.getElementById('stop-' + s.n); if (t) t.scrollIntoView({ behavior: 'smooth' }); });
      mbMarkers.push(new mapboxgl.Marker({ element: el }).setLngLat(s.coords).addTo(mbMap));
    });
  }

  /* ---------- postcard ---------- */
  function drawPostcard() {
    var got = G.stops.filter(has), box = document.getElementById('mwg-pst');
    if (!box) return;
    box.innerHTML = got.length ? got.slice(-6).map(function (s) { return stampSvg(s, 'mwgp' + s.n); }).join('') : '<p>' + esc(T.noSt) + '</p>';
  }
  function sendCard() {
    var p = prog(G), msg = document.getElementById('mwg-msg').value.trim(), to = document.getElementById('mwg-to').value.trim(), fr = document.getElementById('mwg-from').value.trim();
    var text = (to ? (ES ? 'Para ' : 'To ') + to + ': ' : '') + msg + ' ' + T.shareT(p.d, p.t, L(G.name)) + (fr ? ' ' + (ES ? 'De ' : 'From ') + fr + '.' : '');
    var url = location.origin + location.pathname, out = document.getElementById('mwg-sent');
    ga('guide_postcard_share', { guide: G.id, stamps: p.d });
    if (navigator.share) { navigator.share({ title: T.greet, text: text, url: url }).catch(function () {}); return; }
    var all = text + ' ' + url;
    (navigator.clipboard ? navigator.clipboard.writeText(all) : Promise.reject()).then(function () { out.textContent = T.copied; }, function () { out.textContent = all; });
  }

  window.addEventListener('storage', function (e) { if (G && (e.key === 'marlon_visited_spots' || e.key === 'marlon_stamps')) { drawList(); drawMap(); drawProgress(); drawPostcard(); } });
})();
