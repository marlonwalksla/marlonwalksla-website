  .mwp-car { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 4px; max-width: 470px; margin: 0 auto; }

  .mwp-dot[aria-current="true"]::after { background: #FFD43B; }

<script>
(function () {
  var car = document.querySelector(".mwp-car"); if (!car) return;
  var slides = [].slice.call(car.querySelectorAll(".mwp-slide")), dots = [].slice.call(car.querySelectorAll(".mwp-dot")), cap = car.querySelector(".mwp-cap"), i = 0;
  function show(n) {
    i = (n + slides.length) % slides.length;
    slides.forEach(function (s, k) { s.classList.toggle("is-on", k === i); s.setAttribute("aria-hidden", k === i ? "false" : "true"); });
    dots.forEach(function (d, k) { if (k === i) d.setAttribute("aria-current", "true"); else d.removeAttribute("aria-current"); });
    cap.textContent = slides[i].getAttribute("data-cap");
  }
  car.querySelector(".mwp-prev").addEventListener("click", function () { show(i - 1); });
  car.querySelector(".mwp-next").addEventListener("click", function () { show(i + 1); });
  dots.forEach(function (d, k) { d.addEventListener("click", function () { show(k); }); });
  var x0 = null; car.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  car.addEventListener("touchend", function (e) { if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) show(i + (dx < 0 ? 1 : -1)); x0 = null; });
  show(0);
})();
</script>
