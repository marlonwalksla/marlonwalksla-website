<style>

  .mwp { margin: 0 0 22px; }

<script>
/* Oct 23, 2026: Team photos use the shared slider (mw-slider.js). This glue keeps the quote and the price-card occasion in step with the photo. */
(function () {
  var car = document.getElementById("mwp-car"); if (!car) return;
  document.addEventListener("mws:change", function (e) {
    if (e.detail.root !== car || !e.detail.slide) return;
    var s = e.detail.slide;
    try { window.dispatchEvent(new CustomEvent("mwcel2", { detail: s.getAttribute("data-c") })); } catch (x) {}
    var qq = document.querySelector(".mwp-q blockquote"), qb = document.querySelector(".mwp-q .mwp-by"), dq = s.getAttribute("data-q");
    if (qq && qb && dq) { qq.textContent = "\u201C" + dq + "\u201D"; qb.textContent = s.getAttribute("data-by"); }
  });
  /* the quote box keeps one height for all four quotes, so the price card below never moves */
  function lock() { if (window.MWS) window.MWS.lockQuote(document.querySelector(".mwp-q blockquote"), [].map.call(car.querySelectorAll(".mws-slide"), function (s) { return s.getAttribute("data-q"); })); }
  if (window.MWS) lock(); else window.addEventListener("mws:ready", lock);
  /* the occasion chosen in the price card (birthday, milestone, offsite, just because) picks the photo */
  window.addEventListener("mwcel", function (e) {
    var L = car.querySelectorAll(".mws-slide");
    for (var k = 0; k < L.length; k++) { if (L[k].getAttribute("data-c") === e.detail) { if (car.mws) car.mws.set(k); break; } }
  });
})();
</script>
