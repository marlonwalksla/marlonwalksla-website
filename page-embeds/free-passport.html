    $('fp-sub').textContent=(m==='def'&&n===9)?T.sub.end:T.sub[m];
    $('fp-n').textContent=n;
    $('fp-badge').setAttribute('aria-label',n+' '+T.of);
    btns.forEach(function(b,i){var on=has(S[i]);b.classList.toggle('on',on);b.setAttribute('aria-pressed',on?'true':'false')});
    $('fp-pcgo').hidden=n<1;$('fp-pcgo').textContent=T.pcgo;
    $('fp-cnote').textContent=n<1?T.cn0:(n<9?T.cn1:'');
    $('fp-postcard').hidden=n<1;
    var sel=$('fp-pc-place'),cur=sel.value,earned=[];
    S.forEach(function(s,i){if(has(s))earned.push(i)});
    sel.innerHTML='';earned.forEach(function(i){var o=document.createElement('option');o.value=i;o.textContent=es?S[i][3]:S[i][2];sel.appendChild(o)});
    if(cur&&earned.indexOf(+cur)>-1)sel.value=cur;else if(earned.length)sel.value=earned[earned.length-1];
    updPc();
  }
  var photo=null,ernImg=null;
  function pcPlace(){var i=+$('fp-pc-place').value;return es?S[i][3]:S[i][2]}
  function pcText(){
    var to=$('fp-pc-to').value.trim(),msg=$('fp-pc-msg').value.trim()||T.ph;
    return (to?to+', ':'')+T.greet+' '+pcPlace()+'! '+msg+' '+T.sig+' https://www.marlonwalksla.com';
  }
  function updPc(){
    if(!$('fp-pc-place').options.length)return;
    var t=pcText(),to=$('fp-pc-to').value.trim();
    $('fp-pv-gr').textContent=T.greet;$('fp-pv-place').textContent=pcPlace();
    $('fp-pv-to').textContent=to?T.to+': '+to:'';
    $('fp-pv-msg').textContent=$('fp-pc-msg').value.trim()||T.ph;
    $('fp-pc-wa').href='https://wa.me/?text='+encodeURIComponent(t);
    $('fp-pc-mail').href='mailto:?subject='+encodeURIComponent(T.greet+' Los Angeles')+'&body='+encodeURIComponent(t);
  }
  $('fp-pc-file').addEventListener('change',function(){
    var f=this.files&&this.files[0];if(!f)return;
    var u=URL.createObjectURL(f),im=new Image();
    im.onload=function(){photo=im;$('fp-pv-ph').style.backgroundImage='url('+u+')';$('fp-pv-empty').textContent='';$('fp-pc-fb').textContent=T.up2};
    im.src=u;
  });
  function loadErn(){return new Promise(function(res){if(ernImg)return res(ernImg);var im=new Image();im.crossOrigin='anonymous';im.onload=function(){ernImg=im;res(im)};im.onerror=function(){res(null)};im.src=$('fp-pv-ern').src})}
  function wrap(c,text,x,y,w,lh,max){var words=text.split(/\s+/),line='',n=0;for(var i=0;i<words.length;i++){var t=line?line+' '+words[i]:words[i];if(c.measureText(t).width>w&&line){c.fillText(line,x,y);y+=lh;line=words[i];if(++n>=max)return y}else line=t}c.fillText(line,x,y);return y+lh}
  function draw(withErn){
    var W=1200,H1=860,H2=640,cv=document.createElement('canvas');cv.width=W;cv.height=H1+H2;var c=cv.getContext('2d');
    c.fillStyle='#FFF8EC';c.fillRect(0,0,W,H1+H2);
    // front photo (cover fit)
    c.fillStyle='#DFE8C0';c.fillRect(0,0,W,H1);
    if(photo){var r=Math.max(W/photo.naturalWidth,H1/photo.naturalHeight),w=photo.naturalWidth*r,h=photo.naturalHeight*r;c.save();c.beginPath();c.rect(0,0,W,H1);c.clip();c.drawImage(photo,(W-w)/2,(H1-h)/2,w,h);c.restore()}
    // label
    c.font='500 30px Fredoka, sans-serif';var g=T.greet.toUpperCase();c.font='400 64px "Lilita One", sans-serif';var pl=pcPlace();
    var lw=Math.max(c.measureText(pl).width,300)+60;c.fillStyle='#FDFCDF';c.strokeStyle='#30312B';c.lineWidth=8;
    c.beginPath();c.roundRect(40,H1-190,lw,150,24);c.fill();c.stroke();
    c.fillStyle='#30312B';c.font='500 28px Fredoka, sans-serif';c.fillText(g,70,H1-135);c.font='400 64px "Lilita One", sans-serif';c.fillText(pl,70,H1-70);
    if(withErn&&ernImg){c.save();c.beginPath();c.arc(W-110,110,70,0,7);c.clip();c.drawImage(ernImg,W-180,40,140,140);c.restore();c.lineWidth=8;c.beginPath();c.arc(W-110,110,70,0,7);c.stroke()}
    // back panel
    c.save();c.translate(0,H1);c.strokeStyle='#30312B';c.lineWidth=5;c.setLineDash([22,16]);c.beginPath();c.moveTo(0,0);c.lineTo(W,0);c.stroke();c.setLineDash([]);
    c.fillStyle='#E8412F';c.font='400 52px Caveat, Fredoka, cursive';var to=$('fp-pc-to').value.trim();if(to)c.fillText(T.to+': '+to,60,90);
    c.fillStyle='#30312B';c.font='400 58px Caveat, Fredoka, cursive';var y=wrap(c,$('fp-pc-msg').value.trim()||T.ph,60,170,W-120,70,5);
    c.fillRect(60,H2-170,W-120,3);
    if(withErn&&ernImg){c.drawImage(ernImg,60,H2-150,110,110)}
    c.font='500 32px Fredoka, sans-serif';c.fillText('MarlonWalksLA  ·  @marlonwalksla',withErn&&ernImg?200:60,H2-100);
    c.font='400 28px Fredoka, sans-serif';c.fillText('WhatsApp +1 269 267 0410  ·  marlonwalksla.com',withErn&&ernImg?200:60,H2-55);
    c.restore();
    // airmail edge around the whole card
    var bw=14;
    c.lineWidth=bw;c.strokeStyle='#E8412F';c.setLineDash([46,46]);c.strokeRect(bw/2,bw/2,W-bw,H1+H2-bw);c.strokeStyle='#2890B6';c.lineDashOffset=-46;c.strokeRect(bw/2,bw/2,W-bw,H1+H2-bw);c.setLineDash([]);
    return cv;
  }
  function makeBlob(){
    return Promise.all([document.fonts?document.fonts.load('400 40px "Lilita One"'):0,document.fonts?document.fonts.load('500 30px Fredoka'):0,document.fonts?document.fonts.load('400 40px Caveat'):0]).catch(function(){}).then(loadErn).then(function(){
      return new Promise(function(res){
        function go(w){try{draw(w).toBlob(function(b){res(b)},'image/png')}catch(e){if(w)go(false);else res(null)}}
        go(true);
      });
    });
  }
  $('fp-pc-send').onclick=function(){
    makeBlob().then(function(b){
      if(!b){window.open($('fp-pc-wa').href);return}
      var f=new File([b],'postcard-from-la.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],text:pcText()}).catch(function(){})}
      else dl(b);
    });
  };
  $('fp-pc-save').onclick=function(){makeBlob().then(function(b){if(b)dl(b)})};
  function dl(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='postcard-from-la.png';document.body.appendChild(a);a.click();a.remove()}
  ['fp-pc-place','fp-pc-to','fp-pc-msg'].forEach(function(id){$(id).addEventListener('input',updPc);$(id).addEventListener('change',updPc)});
  $('fp-pc-hd').textContent=T.hd;$('fp-pc-h').textContent=T.pch;$('fp-pc-p').textContent=T.pcp;$('fp-pc-l1').textContent=T.l1;$('fp-pc-l2').textContent=T.l2;$('fp-pc-l3').textContent=T.l3;
  $('fp-pc-lph').textContent=T.lph;$('fp-pc-fb').textContent=T.up;$('fp-pv-empty').textContent=T.empty;$('fp-pc-msg').placeholder=T.ph;
  $('fp-pc-send').textContent=T.send;$('fp-pc-save').textContent=T.pcsave;$('fp-pc-wa').textContent=T.pcwa;$('fp-pc-mail').textContent=T.mail;$('fp-pc-priv').textContent=T.priv;
  $('fp-kick').textContent=T.kick;$('fp-of').textContent=T.of;$('fp-save').textContent=T.save;
  $('fp-go').textContent=T.go;
  $('fp-rv-h').textContent=T.rvh;$('fp-rv-p').textContent=T.rvp;$('fp-rv-n').textContent=T.rvn;
  var rv=$('fp-rv');rv.textContent=T.rv;rv.href=REVIEW_URL||'https://www.google.com/search?q=MarlonWalksLA+reviews';
  $('fp-route-h').textContent=T.route;
  S.forEach(function(s,i){var d=document.createElement('div');d.innerHTML='<b>'+(i+1)+'</b><span>'+(es?s[3]:s[2])+'</span>';$('fp-route').appendChild(d)});
  $('fp-map').textContent=T.map;$('fp-map').href=es?'/maps?lang=es':'/maps';
  $('fp-ig').textContent=T.ig;$('fp-wa').textContent=T.wa;
  $('fp-reset').textContent=T.reset;
  $('fp-reset').onclick=function(){if(confirm(T.confirm)){S.forEach(function(s){set(s,false)});render()}};
  $('fp-start').hidden=mode!=='start';$('fp-end').hidden=mode!=='end';
  if(mode==='end')S.forEach(function(s){set(s,true)}); // QR 2: everyone who finished the walk gets all 9
  render();
})();
</script>
