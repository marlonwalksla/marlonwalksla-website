# Refreshes jsDelivr's copy of the site files after every push to the
# "test" or "live" branch (and main), so changes show up within a minute
# or two instead of waiting up to 12 hours for the cache to expire.
#   test -> what marlonwalksla.webflow.io loads
#   live -> what marlonwalksla.com loads (only push here when Marlon says OK)
name: Refresh jsDelivr cache

on:
  push:
    branches: [main, test, live]
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Purge every site file from jsDelivr
        run: |
          base="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}"
          for f in *.js *.css *.geojson page-embeds/*.html; do
            [ -e "$f" ] || continue
            code=$(curl -s -o /dev/null -w "%{http_code}" "$base/$f")
            echo "$code  $f"
          done
